<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="resources/images/icons/favicon.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="resources/images/icons/favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <title>Hire | Brian Crink</title>
  <link rel="stylesheet" href="resources/search-bar/search-bar.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      background-color: #000000;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: -1;
      pointer-events: none;
    }

    #gridCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      position: relative;
      z-index: 2;
      transition: background 0.4s;
      opacity: 0;
      animation: fadeIn 1.3s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    :root {
      --stage-top: 24%; /*adjust height of all stage + tools elements */
      --crumb-y: -50px; /*adjust breadcrumb position */
      --name-y: -24px; /*adjust name position */
      --status-y: 46px; /*adjust hire-status position */
      --location-y: 100px; /*adjust location-status position */
      --tool-gap: 140px; /*adjust pill + search bar position */
    }

    .stage,
    .tools {
      text-align: center;
      width: 100%;
      max-width: 450px;
      padding: 0 20px;
      z-index: 3;
    }

    .stage,
    .tools {
      position: absolute;
      top: var(--stage-top);
      left: 50%;
      transform: translateX(-50%);
    }

    .tools {
      padding-top: var(--tool-gap);
      pointer-events: none;
    }

    .mode-toggle,
    .search-wrapper {
      pointer-events: auto;
    }

    .dots {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle, #161616 2px, transparent 1px);
      background-size: 24px 24px; /*30*/
      background-position: 15.5px 15.5px;
      pointer-events: none;
      z-index: 0;
      /* animation: dotPulse 6s ease-in-out infinite; */
      opacity: 0;
      will-change: opacity;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0; }
      50%      { opacity: 0.95; }
    }

    /* .dots.interactive {
      animation: dotPulse 2.5s ease-in-out infinite;
      opacity: 1;
    } */

    .identity {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--name-y);
      text-align: center;
    }

    .name {
      font-size: 3.0rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .name-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    
    .name-link:hover {
      opacity: 0.85;
    }

    .sub-header .portal-word {
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 0.08rem;
    }

    .sub-header .career-word,
    .sub-header .career-word .os-mark {
      font-size: 1.1rem;
      line-height: 1;
      letter-spacing: 0.04rem;
    }

    .sub-header {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--crumb-y);
      margin: 0;
      color: #0cff04c5;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55em;
      white-space: nowrap;
      letter-spacing: 0.16em;
    }

    .sub-header .crumb-dot {
      color: #8b949e;
      font-weight: 500;
      font-size: 0.85em;
      line-height: 1;
      letter-spacing: 0;
    }

    .sub-header-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .sub-header-link:hover {
      opacity: 0.85;
    }

    @property --pc1 { syntax: '<color>'; inherits: false; initial-value: #ff006e; }
    @property --pc2 { syntax: '<color>'; inherits: false; initial-value: #8338ec; }
    @property --pc3 { syntax: '<color>'; inherits: false; initial-value: #3a86ff; }
    @property --pc4 { syntax: '<color>'; inherits: false; initial-value: #06d6a0; }
    @property --pc5 { syntax: '<color>'; inherits: false; initial-value: #ffbe0b; }

    @keyframes portalChromaFade {
      0%   { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
      20%  { --pc1: #ffbe0b; --pc2: #ff006e; --pc3: #8338ec; --pc4: #3a86ff; --pc5: #06d6a0; }
      40%  { --pc1: #06d6a0; --pc2: #ffbe0b; --pc3: #ff006e; --pc4: #8338ec; --pc5: #3a86ff; }
      60%  { --pc1: #3a86ff; --pc2: #06d6a0; --pc3: #ffbe0b; --pc4: #ff006e; --pc5: #8338ec; }
      80%  { --pc1: #8338ec; --pc2: #3a86ff; --pc3: #06d6a0; --pc4: #ffbe0b; --pc5: #ff006e; }
      100% { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
    }

    .sub-header-link.portal-word {
      background-image: linear-gradient(
        90deg,
        var(--pc1),
        var(--pc2),
        var(--pc3),
        var(--pc4),
        var(--pc5)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: portalChromaFade 8s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .sub-header-link.portal-word {
        animation: none;
      }
    }

    .os-mark {
      font-weight: 600;
      color: #ffffff;
    }

    .hire-status-row {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--status-y);
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 0;
    }

    .location-status {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--location-y);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0;
      color: #8b949e;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }

    .location-status .hire-pin {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      display: block;
    }

    .hire-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0;
      /* color: #09ff00; */
      color: #8b949e;
      font-size: 0.95rem;
      font-weight: 340;
      letter-spacing: 0.02rem;
      line-height: 1;
      white-space: nowrap;
      padding: 8px 20px 8px 30px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 50px;
      background: rgba(0, 0, 0, 0.56);
    }

    .hire-status .hire-beacon {
      position: relative;
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      margin: 0;
      opacity: 1;
      visibility: visible;
      pointer-events: none;
      z-index: 3;
    }

    .hire-status .hire-dot {
      width: 12px;
      height: 12px;
      background: #27c93f;
      border-radius: 50%;
      box-shadow: 0 0 10px #27c93f;
      position: relative;
      z-index: 3;
      display: block;
    }

    .hire-status .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background: #18b02f;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.45;
      animation: pulseBeacon 1.35s infinite ease-out;
      z-index: 2;
      pointer-events: none;
    }

    @keyframes pulseBeacon {
      0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(2.3); opacity: 0; }
    }

    .mode-toggle {
      position: relative;
      display: inline-flex;
      background: rgba(255, 255, 255, 0.023);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      padding: 4px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 32px;
      width: 100%;
      max-width: 210px;
      z-index: 4;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-toggle:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .toggle-slider {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      background: rgba(0, 255, 157, 0.9);
      border-radius: 46px;
      transition: left 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      z-index: 1;
    }

    .mode-toggle.services .toggle-slider {
      left: calc(50% + 0px);
    }

    .toggle-option {
      flex: 1;
      padding: 8px 16px;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      border-radius: 46px;
      z-index: 2;
      transition: color 0.2s ease;
    }

    .toggle-option.active {
      color: #000000;
      font-weight: 600;
    }

    .toggle-option.inactive {
      color: #aaaaaa;
    }

  </style>
</head>
<body>
  <div class="background"></div>
  <canvas id="gridCanvas"></canvas>
  <div class="dots"></div>

  <div class="stage">
    <p class="sub-header">
      <a href="https://portal.briancrink.com#career" class="sub-header-link portal-word">Portal</a>
      <span class="crumb-dot" aria-hidden="true">•</span>
      <a href="https://os.briancrink.com/career" class="sub-header-link career-word">Career<span class="os-mark">OS</span></a>
    </p>
    <div class="identity">
      <h1 class="name"><a href="https://briancrink.com" class="name-link">Brian Crink</a></h1>
    </div>
    <div class="hire-status-row" id="hireStatusRow">
      <p class="hire-status">
        Available For Hire
        <span class="hire-beacon is-on" id="hireBeacon" aria-hidden="true">
          <span class="pulse-ring"></span>
          <span class="hire-dot"></span>
        </span>
      </p>
    </div>
    <div class="location-status" id="locationStatus">
      <svg class="hire-pin" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
      </svg>
      <span>USA · Remote</span>
    </div>
  </div>

  <div class="tools">
    <div class="mode-toggle" id="modeToggle">
      <div class="toggle-slider" id="toggleSlider"></div>

      <div class="toggle-option active" id="rolesOption" onclick="switchMode('roles')">
        Roles
      </div>
      <div class="toggle-option inactive" id="servicesOption" onclick="switchMode('services')">
        Services
      </div>
    </div>

    <div class="search-wrapper" id="searchWrapper">
      <div class="search-bar" id="searchBar">
        <div class="search-icon" id="searchIcon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>

        <input type="text" id="searchInput"
             placeholder="Search roles, services, keywords"
             autocomplete="off" spellcheck="false">
        <div class="right-spacer" aria-hidden="true"></div>
      </div>

      <div class="icon-circles" id="iconCircles">
        <div class="icon-circle" id="menuIcon"    role="button" tabindex="-1" aria-label="Menu">≡</div>
        <div class="icon-circle" id="commandIcon" role="button" tabindex="-1" aria-label="Commands">⌘</div>
      </div>

      <div class="overlay-box" id="overlayBox">
        <p style="margin: 0; color: #ccc; font-size: 15px;">
          Quick commands or actions appear here
        </p>
      </div>
    </div>
  </div>

  <script src="resources/search-bar/search-bar.js"></script>

  <script>
    function modeFromHash() {
      const key = String(location.hash || '').replace(/^#/, '').trim().toLowerCase();
      return key === 'services' ? 'services' : 'roles';
    }

    function applyMode(mode, pushHash) {
      const toggle = document.getElementById('modeToggle');
      const servicesOption = document.getElementById('servicesOption');
      const rolesOption = document.getElementById('rolesOption');
      const next = mode === 'services' ? 'services' : 'roles';

      if (next === 'services') {
        toggle.classList.add('services');
        rolesOption.classList.remove('active');
        rolesOption.classList.add('inactive');
        servicesOption.classList.remove('inactive');
        servicesOption.classList.add('active');
      } else {
        toggle.classList.remove('services');
        servicesOption.classList.remove('active');
        servicesOption.classList.add('inactive');
        rolesOption.classList.remove('inactive');
        rolesOption.classList.add('active');
      }

      if (pushHash) writeHash(next, false);
    }

    function canWriteHistory() {
      try {
        return window.top === window && location.protocol !== 'about:' && location.origin !== 'null';
      } catch (err) {
        return false;
      }
    }

    function writeHash(mode, replace) {
      if (!canWriteHistory()) return;
      const hash = '#' + mode;
      try {
        if (replace) history.replaceState({ mode: mode }, '', hash);
        else if (location.hash !== hash) history.pushState({ mode: mode }, '', hash);
      } catch (err) {}
    }

    function switchMode(mode) {
      applyMode(mode, true);
    }

    window.addEventListener('hashchange', () => applyMode(modeFromHash(), false));
    window.addEventListener('popstate', () => applyMode(modeFromHash(), false));
    if (!location.hash) writeHash('roles', true);
    applyMode(modeFromHash(), false);

    const GRID = 24; //30
    const WELL = 16;
    const WELL_R = 64;
    const RIPPLE_AMP = 7;
    const RIPPLE_LEN = 22;
    const RIPPLE_SPEED = 2.4;
    const RIPPLE_DECAY = 120;
    const RIPPLE_OPACITY = 0.14;
    const GRID_ALPHA = 0.6;

    const gridCanvas = document.getElementById('gridCanvas');
    const gridCtx = gridCanvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let canvasW = 0;
    let canvasH = 0;

    function snapHireDotToGrid() {
      const beacon = document.getElementById('hireBeacon');
      if (!beacon) return;

      beacon.style.transform = '';

      const rect = beacon.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const snapX = Math.round(cx / GRID) * GRID;
      beacon.style.transform = 'translateX(' + (snapX - cx) + 'px)';
    }

    function scheduleSnap() {
      requestAnimationFrame(snapHireDotToGrid);
    }

    function beaconOrigin() {
      const beacon = document.getElementById('hireBeacon');
      if (!beacon) {
        return { x: canvasW * 0.5, y: canvasH * 0.24 };
      }
      const rect = beacon.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };
    }

    function resizeGridCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvasW = window.innerWidth;
      canvasH = window.innerHeight;
      gridCanvas.width = Math.floor(canvasW * dpr);
      gridCanvas.height = Math.floor(canvasH * dpr);
      gridCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function warpPoint(x, y, cx, cy, t) {
      const dx = x - cx;
      const dy = y - cy;
      const r = Math.hypot(dx, dy) || 0.0001;
      const ux = dx / r;
      const uy = dy / r;
      const env = Math.exp(-r / RIPPLE_DECAY);
      const wave = reduceMotion ? 0 : Math.sin(r / RIPPLE_LEN - t * RIPPLE_SPEED);
      let pull = -WELL * Math.exp(-r / WELL_R);
      if (!reduceMotion) pull += RIPPLE_AMP * wave * env;
      const crest = Math.max(0, wave) * env;
      return { x: x + ux * pull, y: y + uy * pull, crest: crest };
    }

    function strokeSeg(ctx, a, b) {
      const crest = (a.crest + b.crest) * 0.5;
      const lift = RIPPLE_OPACITY * crest;
      const g = Math.round(16 + lift * 140);
      ctx.strokeStyle = 'rgba(' + g + ',' + g + ',' + g + ',' + Math.min(0.9, GRID_ALPHA + lift) + ')';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    function drawWellRipple(now) {
      const t = now / 1000;
      const origin = beaconOrigin();
      const ctx = gridCtx;
      const cols = Math.ceil(canvasW / GRID) + 2;
      const rows = Math.ceil(canvasH / GRID) + 2;

      ctx.clearRect(0, 0, canvasW, canvasH);
      ctx.lineWidth = 1;
      ctx.lineJoin = 'round';

      for (let c = 0; c <= cols; c++) {
        let prev = null;
        for (let r = 0; r <= rows; r++) {
          const p = warpPoint(c * GRID, r * GRID, origin.x, origin.y, t);
          if (prev) strokeSeg(ctx, prev, p);
          prev = p;
        }
      }

      for (let r = 0; r <= rows; r++) {
        let prev = null;
        for (let c = 0; c <= cols; c++) {
          const p = warpPoint(c * GRID, r * GRID, origin.x, origin.y, t);
          if (prev) strokeSeg(ctx, prev, p);
          prev = p;
        }
      }

      requestAnimationFrame(drawWellRipple);
    }

    window.addEventListener('load', scheduleSnap);
    window.addEventListener('resize', () => {
      resizeGridCanvas();
      scheduleSnap();
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(scheduleSnap);
    }

    resizeGridCanvas();
    requestAnimationFrame(drawWellRipple);

    const dots = document.querySelector('.dots');
    const toggle = document.getElementById('modeToggle');
    const searchInput = document.getElementById('searchInput');

    function activateDots() {
      // dots.classList.add('interactive');
    }

    function deactivateDots() {
      // dots.classList.remove('interactive');
    }

    searchInput.addEventListener('focus', activateDots);
    searchInput.addEventListener('blur', deactivateDots);

    toggle.addEventListener('mouseenter', activateDots);
    toggle.addEventListener('mouseleave', deactivateDots);
  </script>
</body>
</html>
