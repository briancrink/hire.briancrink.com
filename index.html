<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cstyle%3Epath%7Bfill:%231a1a1a%7D%40media (prefers-color-scheme:dark)%7Bpath%7Bfill:%23ffffff%7D%7D%3C/style%3E%3Cpath d='M12 2.45c2.55 0 4.35 1.95 4.45 5.05.1 1.75-.3 3.3-1.15 4.3C14.5 13.2 13.3 13.9 12 13.9s-2.5-.7-3.3-2.1C7.85 10.8 7.45 9.25 7.55 7.5 7.65 4.4 9.45 2.45 12 2.45z'/%3E%3Cpath fill-rule='evenodd' d='M3.05 22v-5.5c.15-2.05 3.5-3.35 7.2-2.55L12.05 16.2 13.8 14c3.7-.85 7.05.5 7.15 2.5V22H3.05zM10.2 14.85 12.05 16.7 13.85 14.9l.85.7-1.05 6.4h-3.2l-1.1-6.4.85-.75zM16.05 17.2h1.65v1.1H16.05z'/%3E%3Cpath d='M11.25 16.55h1.6L12.05 21.2z'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon-light-hire.png.png">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon-dark-hire.png.png" media="(prefers-color-scheme: dark)">
  <title>Hire | Brian Crink</title>
  <link rel="stylesheet" href="resources/search-bar/search-bar.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --page-bg: #000000;
      --page-fg: #ffffff;
    }

    html {
      background-color: var(--page-bg);
      color: var(--page-fg);
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      transition: background-color 0.45s ease, color 0.45s ease;
    }

    html, body {
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body.light,
    html:has(body.light) {
      --page-bg: #ffffff;
      --page-fg: #1a1a1a;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--page-bg);
      z-index: -1;
      pointer-events: none;
      transition: background-color 0.45s ease;
    }

    #gridCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      background-color: var(--page-bg);
      color: var(--page-fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      position: relative;
      z-index: 2;
      transition: background-color 0.45s ease, color 0.45s ease;
      opacity: 0;
      animation: fadeIn 1.3s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    :root {
      --stage-top: 12vh; /*adjust height of all stage + tools elements */
      --crumb-y: -62px; /*adjust breadcrumb position */
      --name-y: -24px; /*adjust name position */
      --status-y: 46px; /*adjust hire-status position */
      --location-y: 100px; /*adjust location-status position */
      --dev-image-y: 126px; /*adjust developer image position */
      --tool-gap: 270px; /*adjust pill + search bar position */
      --board-y: 168px; /*padding from tools to first card row — do not snap this away on load */
      --card-min: 460px; /*min card width before wrapping to next row */
      --card-fade: 8px; /*fade-out zone height under the search bar — lower this to shrink the dissolve */
      --card-fade-gap: 0px; /*space below the search bar before fade starts */
      --snap-pad: 36px; /*gap under the search bar when a row is seated */
      --snap-ms: 720; /*row snap duration in ms */
      --board-gap: 14px;
      --card-reveal-y: 12px; /*how far cards start below their resting spot before the fade-in settles */
      --hero-compact: 0; /*0 = full hero, 1 = memoji/location gone, tools locked high */
      --tool-collapse: 170px; /*distance tools + cards rise: tool-gap (270) - location-y (100) */
      --compact-range: 160px; /*scroll distance that completes the collapse */
      --scroll-cancel: 0px; /*undo compact-range scroll on the board so short rows stay seated */
      --chrome-expanded: 420px;
    }

    .stage,
    .tools {
      text-align: center;
      width: 100%;
      max-width: 450px;
      padding: 0 20px;
      z-index: 3;
    }

    .stage,
    .tools {
      position: fixed;
      top: var(--stage-top);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .tools {
      transform: translate3d(-50%, calc(var(--hero-compact) * var(--tool-collapse) * -1), 0);
      will-change: transform;
    }

    .tools {
      padding-top: var(--tool-gap);
      pointer-events: none;
    }

    .mode-toggle,
    .search-wrapper {
      pointer-events: auto;
    }

    .dots {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle, #161616 2px, transparent 1px);
      background-size: 24px 24px; /*30*/
      background-position: 15.5px 15.5px;
      pointer-events: none;
      z-index: 0;
      /* animation: dotPulse 6s ease-in-out infinite; */
      opacity: 0;
      will-change: opacity;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0; }
      50%      { opacity: 0.95; }
    }

    /* .dots.interactive {
      animation: dotPulse 2.5s ease-in-out infinite;
      opacity: 1;
    } */

    .identity {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--name-y);
      text-align: center;
      z-index: 2;
    }

    .name-wrap {
      position: relative;
      display: inline-block;
    }

    .dev-image-mini {
      position: absolute;
      left: 100%;
      top: 50%;
      width: 60px;
      height: 60px;
      margin: 0 0 0 10px;
      object-fit: contain;
      pointer-events: none;
      transform: translateY(-50%);
      opacity: calc(max(0, (var(--hero-compact) - 0.9) / 0.10));
      z-index: 2;
    }

    .name {
      font-size: 3.0rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .name-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    
    .name-link:hover {
      opacity: 0.85;
    }

    .dev-image {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--dev-image-y);
      width: 160px;
      max-width: 160px;
      height: auto;
      margin: 0 auto;
      opacity: 1;
      z-index: 1;
      pointer-events: none;
    }

    .sub-header .portal-word {
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 0.08rem;
    }

    .sub-header .career-word,
    .sub-header .career-word .os-mark {
      font-size: 1.1rem;
      line-height: 1;
      letter-spacing: 0.04rem;
    }

    .sub-header {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--crumb-y);
      margin: 0;
      color: #ab7affda;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      white-space: nowrap;
      letter-spacing: 0.16em;
    }

    .sub-header .map-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 2.8rem;
      height: 2.8rem;
      flex: 0 0 2.8rem;
      color: inherit;
      text-decoration: none;
      line-height: 0;
    }

    .sub-header .map-link:hover { opacity: 0.85; }

    .sub-header .map-icon {
      width: 3.4rem;
      height: 3.4rem;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: block;
    }

    .sub-header-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .sub-header-link:hover {
      opacity: 0.85;
    }

    @property --pc1 { syntax: '<color>'; inherits: false; initial-value: #ff006e; }
    @property --pc2 { syntax: '<color>'; inherits: false; initial-value: #8338ec; }
    @property --pc3 { syntax: '<color>'; inherits: false; initial-value: #3a86ff; }
    @property --pc4 { syntax: '<color>'; inherits: false; initial-value: #06d6a0; }
    @property --pc5 { syntax: '<color>'; inherits: false; initial-value: #ffbe0b; }

    @keyframes portalChromaFade {
      0%   { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
      20%  { --pc1: #ffbe0b; --pc2: #ff006e; --pc3: #8338ec; --pc4: #3a86ff; --pc5: #06d6a0; }
      40%  { --pc1: #06d6a0; --pc2: #ffbe0b; --pc3: #ff006e; --pc4: #8338ec; --pc5: #3a86ff; }
      60%  { --pc1: #3a86ff; --pc2: #06d6a0; --pc3: #ffbe0b; --pc4: #ff006e; --pc5: #8338ec; }
      80%  { --pc1: #8338ec; --pc2: #3a86ff; --pc3: #06d6a0; --pc4: #ffbe0b; --pc5: #ff006e; }
      100% { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
    }

    .sub-header-link.portal-word {
      background-image: linear-gradient(
        90deg,
        var(--pc1),
        var(--pc2),
        var(--pc3),
        var(--pc4),
        var(--pc5)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: portalChromaFade 8s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .sub-header-link.portal-word {
        animation: none;
      }
    }

    .os-mark {
      font-weight: 600;
      color: #ffffff;
    }

    body.light .name { color: #1a1a1a; }
    body.light .os-mark { color: #1a1a1a; }
    body.light .theme-toggle { color: #1a1a1a; }

    .hire-status-row {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--status-y);
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 0;
      z-index: 2;
    }

    .location-status {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--location-y);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0;
      color: #8b949e;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
      opacity: calc(1 - min(1, var(--hero-compact) / 0.35));
      will-change: opacity;
    }

    .location-status .hire-pin {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      display: block;
    }

    .hire-label-stack {
      position: relative;
      display: inline-grid;
      justify-items: start;
      align-items: center;
    }

    .hire-label {
      grid-area: 1 / 1;
      white-space: nowrap;
    }

    .hire-label-hire {
      opacity: calc(1 - min(1, var(--hero-compact) / 0.35));
    }

    .hire-label-place {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: calc(min(1, var(--hero-compact) / 0.45));
    }

    .hire-label-place .hire-pin {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      display: block;
    }

    .hire-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0;
      /* color: #09ff00; */
      color: #8b949e;
      font-size: 0.95rem;
      font-weight: 340;
      letter-spacing: 0.02rem;
      line-height: 1;
      white-space: nowrap;
      padding: 8px 20px 8px 30px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 50px;
      background: rgba(0, 0, 0, 0.56);
    }

    .hire-status .hire-beacon {
      position: relative;
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      margin: 0;
      opacity: 1;
      visibility: visible;
      pointer-events: none;
      z-index: 3;
    }

    .hire-status .hire-dot {
      width: 12px;
      height: 12px;
      background: #27c93f;
      border-radius: 50%;
      box-shadow: 0 0 10px #27c93f;
      position: relative;
      z-index: 3;
      display: block;
    }

    .hire-status .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background: #18b02f;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.45;
      animation: pulseBeacon 1.35s infinite ease-out;
      z-index: 2;
      pointer-events: none;
    }

    @keyframes pulseBeacon {
      0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(2.3); opacity: 0; }
    }

    .mode-toggle {
      position: relative;
      display: inline-flex;
      background: rgba(255, 255, 255, 0.023);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      padding: 4px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 32px;
      width: 100%;
      max-width: 210px;
      z-index: 4;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-toggle:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .toggle-slider {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      background: rgba(0, 255, 157, 0.9);
      border-radius: 46px;
      transition: left 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      z-index: 1;
    }

    .mode-toggle.services .toggle-slider {
      left: calc(50% + 0px);
    }

    .toggle-option {
      flex: 1;
      padding: 8px 16px;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      border-radius: 46px;
      z-index: 2;
      transition: color 0.2s ease;
    }

    .toggle-option.active {
      color: #000000;
      font-weight: 600;
    }

    .toggle-option.inactive {
      color: #aaaaaa;
    }

    #scroller {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--chrome-expanded);
      bottom: 0;
      z-index: 1;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
    }

    .page-flow {
      position: relative;
      width: 100%;
      max-width: min(1680px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 12px 20px 96px;
      z-index: 3;
      pointer-events: none;
      --mask-solid: 0px;
      --mask-end: var(--card-fade);
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0,
        transparent var(--mask-solid),
        #000 var(--mask-end)
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0,
        transparent var(--mask-solid),
        #000 var(--mask-end)
      );
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    /* Transparent — paints nothing, so the canvas grid and mask-faded
       cards underneath render exactly as normal. Its only job is to
       intercept hover/click in the region the mask has faded away, so a
       hidden card can't show a pointer cursor or receive a click. It
       tracks the search bar via the same transform .tools uses, so it
       needs no per-scroll-frame JS at all — only sized on load/resize. */
    #interactionGuard {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 4;
      pointer-events: auto;
      background: transparent;
      transform: translate3d(0, calc(var(--hero-compact) * var(--tool-collapse) * -1), 0);
    }

    #compactPad {
      width: 100%;
      height: 0;
      pointer-events: none;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, var(--card-min));
      justify-content: center;
      justify-items: center;
      gap: var(--board-gap);
      width: 100%;
      pointer-events: auto;
    }

    @media (max-width: 499px) {
      .board {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 768px) {
      .dev-image-mini { display: none; }
    }

    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 40;
      background: transparent;
      border: none;
      width: 48px;
      height: 48px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: transform 0.3s;
      color: #ffffff;
    }

    .theme-toggle:hover { transform: rotate(20deg); }
    .theme-toggle svg { width: 28px; height: 28px; display: block; }

    .hire-card {
      display: none;
      width: var(--card-min);
      max-width: 100%;
      flex: 0 0 var(--card-min);
      text-align: left;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 18px 18px 16px;
      color: #8b949e;
      opacity: 0;
      transform: translateY(var(--card-reveal-y));
      will-change: transform;
      transition: opacity 0.6s ease, transform 0.6s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .hire-card.is-active {
      display: block;
    }


    .hire-card.is-in {
      opacity: 1;
      transform: none;
    }

    /* Applied to a row that's just above the seated row once it has
       settled: rather than leaving a stray sliver of a mostly-faded row
       poking out below the search bar, ease it the rest of the way to
       fully invisible (and non-interactive) over about a second. */
    .hire-card.is-trailing {
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .hire-card.is-active {
      cursor: pointer;
    }

    /* A card hidden behind the search bar is physically covered (for
       pointer purposes) by #interactionGuard, which sits above it and
       intercepts hover/click — so :hover/:focus-within simply never fire
       there. No per-card class or per-frame JS needed to gate this. */

    .hire-card.is-lit,
    .hire-card.is-active:hover,
    .hire-card.is-active:focus-within {
      background: rgba(0, 12, 4, 0.4);
      border-color: #003f0982;
    }

    .card-icon {
      width: 18px;
      height: 18px;
      display: block;
      margin: 0 0 12px;
      color: #ffffff;
    }

    .card-title {
      margin: 0 0 8px;
      color: #d7dbe0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .card-desc {
      margin: 0 0 14px;
      color: #8b949e;
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.45;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 16px;
    }

    .card-tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      color: #8b949e;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .card-label {
      margin: 0 0 8px;
      color: #8b949e;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card-work {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 16px;
    }

    .card-work a,
    .card-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      color: #b7bec6;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: opacity 0.2s ease, border-color 0.2s ease;
    }

    .card-work a:hover,
    .card-actions a:hover {
      opacity: 0.85;
      border-color: rgba(255, 255, 255, 0.16);
    }

    body.light .mode-toggle {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    body.light .mode-toggle:hover {
      background: rgba(0, 0, 0, 0.05);
      border-color: rgba(0, 0, 0, 0.18);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
    }

    body.light .hire-status {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.15);
      color: #374151;
    }

    body.light .location-status {
      color: #374151;
    }

    body.light .hire-card {
      background: rgba(0, 0, 0, 0.05);
      border-color: rgba(0, 0, 0, 0.08);
      color: #4b5563;
    }

  <script>
    (function () {

      const moonIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.35A9 9 0 1 1 9.65 3 7.15 7.15 0 0 0 21 14.35z"/></svg>`;
      function setToggleIcon() {

        toggleBtn.innerHTML = body.classList.contains('light') ? moonIcon : sunIcon;
      }
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          body.classList.toggle('light');
          setToggleIcon();
          if (typeof startGridTheme === 'function') {
            startGridTheme(body.classList.contains('light') ? 1 : 0);
          }
        });
        setToggleIcon();
      }
    })();

    const scroller = document.getElementById('scroller');
    function scrollYNow() {
      return scroller ? scroller.scrollTop : window.scrollY;
    }
    function scrollToY(y, opts) {
      if (!scroller) {
        if (opts && opts.behavior) window.scrollTo({ top: y, behavior: opts.behavior });
        else window.scrollTo(0, y);
        return;
      }
      if (opts && opts.behavior === 'smooth') scroller.scrollTo({ top: y, behavior: 'smooth' });
      else scroller.scrollTop = y;
    }

    function modeFromHash() {
      const key = String(location.hash || '').replace(/^#/, '').trim().toLowerCase();
      return key === 'services' ? 'services' : 'roles';
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function cardLink(item) {
      if (!item || !item.url) return '';
      return '<a href="' + escapeHtml(item.url) + '">' + escapeHtml(item.label || item.url) + '</a>';
    }

    function renderHireCard(card, mode) {
      const icon = card.icon || {};
      const tags = (card.tags || []).map(function (tag) {
        return '<span class="card-tag">' + escapeHtml(tag) + '</span>';
      }).join('');
      const work = (card.work || []).map(cardLink).join('');
      const actions = (card.actions || []).map(cardLink).join('');
      return (
        '<article class="hire-card" data-mode="' + escapeHtml(mode) + '">' +
          '<svg class="card-icon" viewBox="' + escapeHtml(icon.viewBox || '0 0 24 24') + '" aria-hidden="true">' +
            '<path fill="currentColor" d="' + escapeHtml(icon.path || '') + '"/>' +
          '</svg>' +
          '<h3 class="card-title">' + escapeHtml(card.title || '') + '</h3>' +
          '<p class="card-desc">' + escapeHtml(card.desc || '') + '</p>' +
          '<div class="card-tags">' + tags + '</div>' +
          '<p class="card-label">Featured Work</p>' +
          '<div class="card-work">' + work + '</div>' +
          '<div class="card-actions">' + actions + '</div>' +
        '</article>'
      );
    }

    function listCards(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.cards)) return data.cards;
      return [];
    }

    async function loadHireCards() {
      const board = document.getElementById('cardBoard');
      if (!board) return;
      const [rolesRes, servicesRes] = await Promise.all([
        fetch('roles.json', { cache: 'no-store' }),
        fetch('services.json', { cache: 'no-store' })
      ]);
      if (!rolesRes.ok || !servicesRes.ok) {
        throw new Error('Could not load hire card data (roles.json / services.json)');
      }
      const roles = listCards(await rolesRes.json());
      const services = listCards(await servicesRes.json());
      board.innerHTML =
        roles.map(function (card) { return renderHireCard(card, 'roles'); }).join('') +
        services.map(function (card) { return renderHireCard(card, 'services'); }).join('');
    }

    function applyMode(mode, pushHash) {
      const toggle = document.getElementById('modeToggle');
      const servicesOption = document.getElementById('servicesOption');
      const rolesOption = document.getElementById('rolesOption');
      const next = mode === 'services' ? 'services' : 'roles';

      if (next === 'services') {
        toggle.classList.add('services');
        rolesOption.classList.remove('active');
        rolesOption.classList.add('inactive');
        servicesOption.classList.remove('inactive');
        servicesOption.classList.add('active');
      } else {
        toggle.classList.remove('services');
        servicesOption.classList.remove('active');
        servicesOption.classList.add('inactive');
        rolesOption.classList.remove('inactive');
        rolesOption.classList.add('active');
      }

      if (pushHash) writeHash(next, false);
      syncCards(next);
      const search = document.getElementById('searchInput');
      if (search) search.placeholder = next === 'services' ? 'Search Services' : 'Search Roles';
    }

    function canWriteHistory() {
      try {
        return window.top === window && location.protocol !== 'about:' && location.origin !== 'null';
      } catch (err) {
        return false;
      }
    }

    function writeHash(mode, replace) {
      if (!canWriteHistory()) return;
      const hash = '#' + mode;
      try {
        if (replace) history.replaceState({ mode: mode }, '', hash);
        else if (location.hash !== hash) history.pushState({ mode: mode }, '', hash);
      } catch (err) {}
    }

    function switchMode(mode) {
      applyMode(mode, true);
    }

    window.addEventListener('hashchange', () => applyMode(modeFromHash(), false));
    window.addEventListener('popstate', () => applyMode(modeFromHash(), false));

    let cardObserver = null;
    let cardRevealTimer = 0;
    let cardsBooted = false;

    function clearCardObserver() {
      if (cardObserver) {
        cardObserver.disconnect();
        cardObserver = null;
      }
      if (cardRevealTimer) {
        clearTimeout(cardRevealTimer);
        cardRevealTimer = 0;
      }
    }

    function rowKey(card) {
      return Math.round(card.getBoundingClientRect().top);
    }

    function cardsByRow(cards) {
      const rows = [];
      cards.forEach((card) => {
        const top = rowKey(card);
        let row = rows.find((item) => Math.abs(item.top - top) < 12);
        if (!row) {
          row = { top: top, cards: [] };
          rows.push(row);
        }
        row.cards.push(card);
      });
      rows.sort((a, b) => a.top - b.top);
      return rows;
    }

    function headerReserve() {
      const tools = document.querySelector('.tools');
      if (!tools) return 220;
      return Math.max(0, Math.ceil(tools.getBoundingClientRect().bottom) + 16);
    }

    function revealRow(row) {
      const ordered = row.cards.slice().sort((a, b) => {
        return a.getBoundingClientRect().left - b.getBoundingClientRect().left;
      });
      ordered.forEach((card, i) => {
        window.setTimeout(() => {
          card.classList.add('is-in');
          rememberCardPositions();
        }, i * 180);
      });
    }

    function queueCardReveal() {
      clearCardObserver();
      const cards = Array.from(document.querySelectorAll('.hire-card.is-active'));
      cards.forEach((card) => card.classList.remove('is-in'));

      const isBoot = !cardsBooted;
      const hold = isBoot ? 400 : 80;
      cardsBooted = true;
      cardRevealTimer = window.setTimeout(() => {
        const rows = cardsByRow(cards);
        if (!rows.length) return;

        const topCut = headerReserve();
        const first = rows[0];
        const firstVisible = first.cards.some((card) => {
          const rect = card.getBoundingClientRect();
          return rect.top < window.innerHeight * 0.92 && rect.bottom > topCut;
        });
        if (firstVisible) revealRow(first);

        cardObserver = new IntersectionObserver((entries) => {
          const byRow = cardsByRow(cards);
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            const card = entry.target;
            const top = rowKey(card);
            const row = byRow.find((item) => Math.abs(item.top - top) < 12) || byRow.find((item) => item.cards.includes(card));
            if (!row) return;
            revealRow(row);
          });
        }, { threshold: 0.12, rootMargin: '-' + topCut + 'px 0px -8% 0px' });
        cards.forEach((card) => cardObserver.observe(card));
      }, hold);
    }

    function syncCards(mode) {
      const wasBooted = cardsBooted;
      document.querySelectorAll('.hire-card').forEach((card) => {
        card.classList.toggle('is-active', card.dataset.mode === mode);
        card.classList.remove('is-lit', 'is-trailing');
      });
      queueCardReveal();
      if (wasBooted) scheduleRowSnap();
      requestAnimationFrame(ensureCompactScroll);
    }

    if (!location.hash) writeHash('roles', true);
    loadHireCards().then(function () {
      applyMode(modeFromHash(), false);
    }).catch(function (err) {
      console.error(err);
      const board = document.getElementById('cardBoard');
      if (board) board.textContent = 'Could not load hire card data (roles.json / services.json). Serve this folder over http.';
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable);
      if (typing) return;
      e.preventDefault();
      switchMode(e.key === 'ArrowRight' ? 'services' : 'roles');
    });

    const GRID = 24; //30
    const WELL = 16;
    const WELL_R = 64;
    const RIPPLE_AMP = 7;
    const RIPPLE_LEN = 22;
    const RIPPLE_SPEED = 2.4;
    const RIPPLE_DECAY = 120;
    const RIPPLE_OPACITY = 0.14;
    const GRID_ALPHA = 0.6;
    // Beyond this radius the well/ripple's pull on a grid point is well
    // under a pixel (env and pull both decay exponentially), so skipping
    // the trig there is free — visually identical, much cheaper.
    const WARP_CUTOFF = 340;
    const WARP_CUTOFF_SQ = WARP_CUTOFF * WARP_CUTOFF;
    const COLOR_STEPS = 20;

    const gridCanvas = document.getElementById('gridCanvas');
    const gridCtx = gridCanvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let canvasW = 0;
    let canvasH = 0;

    // Precomputed stroke colors bucketed by wave "crest" height, so the
    // draw loop looks a color up instead of building a fresh rgba()
    // string per segment (there can be 1000+ segments a frame).
    const rippleColors = new Array(COLOR_STEPS + 1);
    const GRID_THEME_MS = 450;
    let gridTheme = document.body.classList.contains('light') ? 1 : 0;
    let gridThemeFrom = gridTheme;
    let gridThemeTo = gridTheme;
    let gridThemeStart = 0;

    function mixRippleColors(u) {
      const t = u < 0 ? 0 : u > 1 ? 1 : u;
      for (let i = 0; i <= COLOR_STEPS; i++) {
        const lift = RIPPLE_OPACITY * (i / COLOR_STEPS);
        const g0 = 16 + lift * 140;
        const a0 = Math.min(0.9, GRID_ALPHA + lift);
        const g1 = 30 + lift * 40;
        const a1 = Math.min(0.16, 0.06 + lift * 0.08);
        const g = Math.round(g0 + (g1 - g0) * t);
        const a = a0 + (a1 - a0) * t;
        rippleColors[i] = 'rgba(' + g + ',' + g + ',' + g + ',' + a.toFixed(3) + ')';
      }
    }

    function startGridTheme(to) {
      gridThemeFrom = to > gridTheme ? Math.max(gridTheme, 0.7) : gridTheme;
      gridThemeTo = to;
      gridTheme = gridThemeFrom;
      gridThemeStart = performance.now();
      mixRippleColors(gridTheme);
    }

    function tickGridTheme(now) {
      if (!gridThemeStart) return;
      const raw = Math.min(1, (now - gridThemeStart) / GRID_THEME_MS);
      const goingLight = gridThemeTo > gridThemeFrom;
      const p = goingLight ? (1 - Math.pow(1 - raw, 3)) : Math.pow(raw, 3);
      gridTheme = gridThemeFrom + (gridThemeTo - gridThemeFrom) * p;
      mixRippleColors(gridTheme);
      if (raw >= 1) gridThemeStart = 0;
    }

    mixRippleColors(gridTheme);

    function snapHireDotToGrid() {
      const beacon = document.getElementById('hireBeacon');
      if (!beacon) return;

      beacon.style.transform = '';

      const rect = beacon.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const snapX = Math.round(cx / GRID) * GRID;
      beacon.style.transform = 'translateX(' + (snapX - cx) + 'px)';
    }

    function scheduleSnap() {
      requestAnimationFrame(snapHireDotToGrid);
    }

    // The beacon doesn't move with scroll (it lives in .stage, which is
    // never transformed by the header-collapse animation), so its screen
    // position is effectively constant between resizes. Caching it here
    // avoids a forced layout read (getBoundingClientRect) on every single
    // animation frame — previously the ripple loop's biggest hidden cost.
    let cachedOrigin = null;
    function invalidateBeaconOrigin() {
      cachedOrigin = null;
    }
    function beaconOrigin() {
      if (cachedOrigin) return cachedOrigin;
      const beacon = document.getElementById('hireBeacon');
      if (!beacon) {
        cachedOrigin = { x: canvasW * 0.5, y: canvasH * 0.24 };
        return cachedOrigin;
      }
      const rect = beacon.getBoundingClientRect();
      cachedOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      return cachedOrigin;
    }

    let ripplePointsCols = 0;
    let ripplePointsRows = 0;
    let ripplePX = null;
    let ripplePY = null;
    let rippleCrest = null;
    let ripplePaths = null;

    function resizeGridCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
