<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cstyle%3Epath%7Bfill:%231a1a1a%7D%40media (prefers-color-scheme:dark)%7Bpath%7Bfill:%23ffffff%7D%7D%3C/style%3E%3Cpath d='M12 2.45c2.55 0 4.35 1.95 4.45 5.05.1 1.75-.3 3.3-1.15 4.3C14.5 13.2 13.3 13.9 12 13.9s-2.5-.7-3.3-2.1C7.85 10.8 7.45 9.25 7.55 7.5 7.65 4.4 9.45 2.45 12 2.45z'/%3E%3Cpath fill-rule='evenodd' d='M3.05 22v-5.5c.15-2.05 3.5-3.35 7.2-2.55L12.05 16.2 13.8 14c3.7-.85 7.05.5 7.15 2.5V22H3.05zM10.2 14.85 12.05 16.7 13.85 14.9l.85.7-1.05 6.4h-3.2l-1.1-6.4.85-.75zM16.05 17.2h1.65v1.1H16.05z'/%3E%3Cpath d='M11.25 16.55h1.6L12.05 21.2z'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="resources/images/icons/favicon/apple-touch-icon-light-hire.png">
  <link rel="apple-touch-icon" href="resources/images/icons/favicon/apple-touch-icon-dark-hire.png" media="(prefers-color-scheme: dark)">
  <title>Hire | Brian Crink</title>
  <link rel="stylesheet" href="resources/search-bar/search-bar.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --page-bg: #000000;
      --page-fg: #ffffff;
    }

    html {
      background-color: var(--page-bg);
      color: var(--page-fg);
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      transition: background-color 0.45s ease, color 0.45s ease;
    }

    html, body {
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body.light,
    html:has(body.light) {
      --page-bg: #ffffff;
      --page-fg: #1a1a1a;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--page-bg);
      z-index: -1;
      pointer-events: none;
      transition: background-color 0.45s ease;
    }

    #gridCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      background-color: var(--page-bg);
      color: var(--page-fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      position: relative;
      z-index: 2;
      transition: background-color 0.45s ease, color 0.45s ease;
      opacity: 0;
      animation: fadeIn 1.3s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    :root {
      --stage-top: 12vh; /*adjust height of all stage + tools elements */
      --crumb-y: -62px; /*adjust breadcrumb position */
      --name-y: -24px; /*adjust name position */
      --status-y: 46px; /*adjust hire-status position */
      --location-y: 100px; /*adjust location-status position */
      --dev-image-y: 126px; /*adjust developer image position */
      --tool-gap: 270px; /*adjust pill + search bar position */
      --board-y: 168px; /*padding from tools to first card row — do not snap this away on load */
      --card-min: 460px; /*min card width before wrapping to next row */
      --board-gap: 14px;
      --card-reveal-y: 12px; /*how far cards start below their resting spot before the fade-in settles */
      --hero-compact: 0; /*0 = full hero, 1 = memoji/location gone, tools locked high */
      --tool-collapse: 170px; /*distance tools + cards rise: tool-gap (270) - location-y (100) */
      --compact-range: 160px; /*scroll distance that completes the collapse */
      --scroll-cancel: 0px; /*undo compact-range scroll on the board so short rows stay seated */
      --chrome-expanded: 420px;
    }

    .stage,
    .tools {
      text-align: center;
      width: 100%;
      max-width: 450px;
      padding: 0 20px;
      z-index: 3;
    }

    .stage,
    .tools {
      position: fixed;
      top: var(--stage-top);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .tools {
      transform: translate3d(-50%, calc(var(--hero-compact) * var(--tool-collapse) * -1), 0);
      will-change: transform;
    }

    .tools {
      padding-top: var(--tool-gap);
      pointer-events: none;
    }

    .mode-toggle,
    .search-wrapper {
      pointer-events: auto;
    }

    .dots {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle, #161616 2px, transparent 1px);
      background-size: 24px 24px; /*30*/
      background-position: 15.5px 15.5px;
      pointer-events: none;
      z-index: 0;
      /* animation: dotPulse 6s ease-in-out infinite; */
      opacity: 0;
      will-change: opacity;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0; }
      50%      { opacity: 0.95; }
    }

    /* .dots.interactive {
      animation: dotPulse 2.5s ease-in-out infinite;
      opacity: 1;
    } */

    .identity {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--name-y);
      text-align: center;
      z-index: 2;
    }

    .name-wrap {
      position: relative;
      display: inline-block;
    }

    .dev-image-mini {
      position: absolute;
      left: 100%;
      top: 50%;
      width: 60px;
      height: 60px;
      margin: 0 0 0 10px;
      object-fit: contain;
      pointer-events: none;
      transform: translateY(-50%);
      opacity: calc(max(0, (var(--hero-compact) - 0.9) / 0.10));
      z-index: 2;
    }

    .name {
      font-size: 3.0rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .name-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    
    .name-link:hover {
      opacity: 0.85;
    }

    .dev-image {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--dev-image-y);
      width: 160px;
      max-width: 160px;
      height: auto;
      margin: 0 auto;
      opacity: 1;
      z-index: 1;
      pointer-events: none;
    }

    .sub-header .portal-word {
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 0.08rem;
    }

    .sub-header .career-word,
    .sub-header .career-word .os-mark {
      font-size: 1.1rem;
      line-height: 1;
      letter-spacing: 0.04rem;
    }

    .sub-header {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--crumb-y);
      margin: 0;
      color: #ab7affda;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      white-space: nowrap;
      letter-spacing: 0.16em;
    }

    .sub-header .map-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 2.8rem;
      height: 2.8rem;
      flex: 0 0 2.8rem;
      color: inherit;
      text-decoration: none;
      line-height: 0;
    }

    .sub-header .map-link:hover { opacity: 0.85; }

    .sub-header .map-icon {
      width: 3.4rem;
      height: 3.4rem;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: block;
    }

    .sub-header-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .sub-header-link:hover {
      opacity: 0.85;
    }

    @property --pc1 { syntax: '<color>'; inherits: false; initial-value: #ff006e; }
    @property --pc2 { syntax: '<color>'; inherits: false; initial-value: #8338ec; }
    @property --pc3 { syntax: '<color>'; inherits: false; initial-value: #3a86ff; }
    @property --pc4 { syntax: '<color>'; inherits: false; initial-value: #06d6a0; }
    @property --pc5 { syntax: '<color>'; inherits: false; initial-value: #ffbe0b; }

    @keyframes portalChromaFade {
      0%   { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
      20%  { --pc1: #ffbe0b; --pc2: #ff006e; --pc3: #8338ec; --pc4: #3a86ff; --pc5: #06d6a0; }
      40%  { --pc1: #06d6a0; --pc2: #ffbe0b; --pc3: #ff006e; --pc4: #8338ec; --pc5: #3a86ff; }
      60%  { --pc1: #3a86ff; --pc2: #06d6a0; --pc3: #ffbe0b; --pc4: #ff006e; --pc5: #8338ec; }
      80%  { --pc1: #8338ec; --pc2: #3a86ff; --pc3: #06d6a0; --pc4: #ffbe0b; --pc5: #ff006e; }
      100% { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
    }

    .sub-header-link.portal-word {
      background-image: linear-gradient(
        90deg,
        var(--pc1),
        var(--pc2),
        var(--pc3),
        var(--pc4),
        var(--pc5)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: portalChromaFade 8s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .sub-header-link.portal-word {
        animation: none;
      }
    }

    .os-mark {
      font-weight: 600;
      color: #ffffff;
    }

    body.light .name { color: #1a1a1a; }
    body.light .os-mark { color: #1a1a1a; }
    body.light .theme-toggle { color: #1a1a1a; }

    .hire-status-row {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--status-y);
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 0;
      z-index: 2;
    }

    .location-status {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--location-y);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0;
      color: #8b949e;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
      opacity: calc(1 - min(1, var(--hero-compact) / 0.35));
      will-change: opacity;
    }

    .location-status .hire-pin {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      display: block;
    }

    .hire-label-stack {
      position: relative;
      display: inline-grid;
      justify-items: start;
      align-items: center;
    }

    .hire-label {
      grid-area: 1 / 1;
      white-space: nowrap;
    }

    .hire-label-hire {
      opacity: calc(1 - min(1, var(--hero-compact) / 0.35));
    }

    .hire-label-place {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: calc(min(1, var(--hero-compact) / 0.45));
    }

    .hire-label-place .hire-pin {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      display: block;
    }

    .hire-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0;
      /* color: #09ff00; */
      color: #8b949e;
      font-size: 0.95rem;
      font-weight: 340;
      letter-spacing: 0.02rem;
      line-height: 1;
      white-space: nowrap;
      padding: 8px 20px 8px 30px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 50px;
      background: rgba(0, 0, 0, 0.56);
    }

    .hire-status .hire-beacon {
      position: relative;
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      margin: 0;
      opacity: 1;
      visibility: visible;
      pointer-events: none;
      z-index: 3;
    }

    .hire-status .hire-dot {
      width: 12px;
      height: 12px;
      background: #27c93f;
      border-radius: 50%;
      box-shadow: 0 0 10px #27c93f;
      position: relative;
      z-index: 3;
      display: block;
    }

    .hire-status .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background: #18b02f;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.45;
      animation: pulseBeacon 1.35s infinite ease-out;
      z-index: 2;
      pointer-events: none;
    }

    @keyframes pulseBeacon {
      0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(2.3); opacity: 0; }
    }

    .mode-toggle {
      position: relative;
      display: inline-flex;
      background: rgba(255, 255, 255, 0.023);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      padding: 4px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 32px;
      width: 100%;
      max-width: 210px;
      z-index: 4;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-toggle:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .toggle-slider {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      background: rgba(0, 255, 157, 0.9);
      border-radius: 46px;
      transform-origin: 50% 50%;
      transition: left 0.34s cubic-bezier(0.5, 0, 0.2, 1);
      will-change: left, transform;
      z-index: 1;
    }

    .mode-toggle.services .toggle-slider {
      left: calc(50% + 0px);
    }

    /* Jelly knob: stretches while it travels, squashes on arrival, then
       wobbles out. Runs alongside the 0.34s slide; 0.64s total. */
    .toggle-slider.is-jelly {
      animation: toggleJelly 0.64s ease-in-out both;
    }

    @keyframes toggleJelly {
      0%   { transform: scale(1, 1); }
      24%  { transform: scale(1.2, 0.84); }
      44%  { transform: scale(0.9, 1.1); }
      62%  { transform: scale(1.05, 0.96); }
      80%  { transform: scale(0.985, 1.015); }
      100% { transform: scale(1, 1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .toggle-slider.is-jelly { animation: none; }
    }

    .toggle-option {
      flex: 1;
      padding: 8px 16px;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      border-radius: 46px;
      z-index: 2;
      transition: color 0.2s ease;
    }

    .toggle-option.active {
      color: #000000;
      font-weight: 600;
    }

    .toggle-option.inactive {
      color: #aaaaaa;
    }

    #scroller {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--chrome-expanded);
      bottom: 0;
      z-index: 1;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
    }

    .page-flow {
      position: relative;
      width: 100%;
      max-width: min(1680px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 12px 20px 96px;
      z-index: 3;
      pointer-events: none;
      /* Always leave at least --compact-range of scroll so the header can
         finish collapsing. 100% tracks #scroller's height as it grows during
         the collapse, so max scroll stays constant and the browser never
         clamps scrollTop back mid-collapse (which looked like a bounce when
         content only barely overflowed). Long content is unaffected. */
      min-height: calc(100% + var(--compact-range));
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, var(--card-min));
      justify-content: center;
      justify-items: center;
      gap: var(--board-gap);
      width: 100%;
      pointer-events: auto;
    }

    @media (max-width: 499px) {
      .board {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 768px) {
      .dev-image-mini { display: none; }
    }

    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 40;
      background: transparent;
      border: none;
      width: 48px;
      height: 48px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: transform 0.3s;
      color: #ffffff;
    }

    .theme-toggle:hover { transform: rotate(20deg); }
    .theme-toggle svg { width: 28px; height: 28px; display: block; }

    .hire-card {
      display: none;
      width: var(--card-min);
      max-width: 100%;
      flex: 0 0 var(--card-min);
      text-align: left;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 18px 18px 16px;
      color: #8b949e;
      opacity: 0;
      transform: translateY(var(--card-reveal-y));
      will-change: transform;
      transition: opacity 0.6s ease, transform 0.6s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .hire-card.is-active {
      display: flex;
      flex-direction: column;
    }


    .hire-card.is-in {
      opacity: 1;
      transform: none;
    }

    .hire-card.is-active {
      cursor: pointer;
    }

    /* Hover: quieter cue — the green border brightens a little. */
    .hire-card.is-active:hover,
    .hire-card.is-active:focus-within {
      background: rgba(0, 12, 4, 0.4);
      border-color: rgba(0, 255, 157, 0.24);
    }

    /* Selected: same treatment as an active tag chip (green accent,
       green border, green tint). Wins over hover on the same card. */
    .hire-card.is-active.is-lit {
      background: rgba(0, 255, 157, 0.08);
      border-color: rgba(0, 255, 157, 0.5);
    }

    .hire-card.is-lit .card-title,
    .hire-card.is-lit .card-icon {
      color: #00ff9d;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 22px;
      margin: 0 0 12px;
    }

    .card-icon {
      width: 18px;
      height: 18px;
      display: block;
      flex: 0 0 auto;
      transition: color 0.2s ease;
      color: #ffffff;
    }

    /* Top-right qualifier (e.g. "Primary Role"). Gold, so it never reads
       as the green selection / call-to-action colour. */
    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px 3px 7px;
      border: 1px solid rgba(245, 196, 81, 0.35);
      border-radius: 999px;
      background: rgba(245, 196, 81, 0.08);
      color: #f5c451;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .card-badge svg { width: 11px; height: 11px; display: block; }

    /* Category blocks and the Featured Work / Credentials row share one grid,
       so short tag lists sit side by side instead of stacking. */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 12px 16px;
      margin: 0 0 16px;
    }

    .card-grid:empty { display: none; }
    .card-sec { min-width: 0; }

    .card-foot {
      display: flex;
      justify-content: flex-end;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* The one loud action on the card: same green + black as the active
       toggle. A selected card nudges it with two slow glow pulses. */
    .card-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(0, 255, 157, 0.9);
      color: #000000;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .card-cta:hover { background: #00ff9d; transform: translateY(-1px); }
    .card-cta:active { transform: translateY(0); }

    .hire-card.is-lit .card-cta {
      animation: ctaPulse 1.5s ease-out 0.15s 2;
    }

    @keyframes ctaPulse {
      0%   { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0.55); }
      70%  { box-shadow: 0 0 0 10px rgba(0, 255, 157, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hire-card.is-lit .card-cta { animation: none; }
    }

    .card-title {
      margin: 0 0 8px;
      color: #d7dbe0;
      transition: color 0.2s ease;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .card-desc {
      margin: 0 0 14px;
      color: #8b949e;
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.45;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .card-tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;

      height: 24px;
      padding: 0;
      border: 0;

    .tag-strip {

      z-index: 1;

      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      pointer-events: auto;

      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;

      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.02em;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    }

    .tag-chip .n {
      font-size: 0.68rem;

    .card-tag {
