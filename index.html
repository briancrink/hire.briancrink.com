    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.15"/><line x1="12" y1="2.4" x2="12" y2="5.1"/><line x1="12" y1="18.9" x2="12" y2="21.6"/><line x1="2.4" y1="12" x2="5.1" y2="12"/><line x1="18.9" y1="12" x2="21.6" y2="12"/><line x1="5.2" y1="5.2" x2="7.1" y2="7.1"/><line x1="16.9" y1="16.9" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="16.9" y2="7.1"/><line x1="7.1" y1="16.9" x2="5.2" y2="18.8"/></svg>
  </button>

  <script src="resources/search-bar/search-bar.js"></script>

  <script>
    (function () {
      const toggleBtn = document.getElementById('theme-toggle');
      const body = document.body;
      const sunIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.15"/><line x1="12" y1="2.4" x2="12" y2="5.1"/><line x1="12" y1="18.9" x2="12" y2="21.6"/><line x1="2.4" y1="12" x2="5.1" y2="12"/><line x1="18.9" y1="12" x2="21.6" y2="12"/><line x1="5.2" y1="5.2" x2="7.1" y2="7.1"/><line x1="16.9" y1="16.9" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="16.9" y2="7.1"/><line x1="7.1" y1="16.9" x2="5.2" y2="18.8"/></svg>`;
      const moonIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.35A9 9 0 1 1 9.65 3 7.15 7.15 0 0 0 21 14.35z"/></svg>`;
      function setToggleIcon() {
        if (!toggleBtn) return;
        toggleBtn.innerHTML = body.classList.contains('light') ? moonIcon : sunIcon;
      }
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          body.classList.toggle('light');
          setToggleIcon();
          if (typeof startGridTheme === 'function') {
            startGridTheme(body.classList.contains('light') ? 1 : 0);
          }
        });
        setToggleIcon();
      }
    })();

    const scroller = document.getElementById('scroller');
    let scrollLocked = false; // single row that fits (or no results): nothing to scroll
    function scrollYNow() {
      return scroller ? scroller.scrollTop : window.scrollY;
    }

    function modeFromHash() {
      const key = String(location.hash || '').replace(/^#/, '').trim().toLowerCase();
      return key === 'services' ? 'services' : 'roles';
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function cardLink(item) {
      if (!item || !item.url) return '';
      return '<a href="' + escapeHtml(item.url) + '">' + escapeHtml(item.label || item.url) + '</a>';
    }

    /* ---------- Tag categories (tags.json) ----------
       tags.json maps each tag to a category id; categories carry the label
       and display order; aliases fold variants into one tag (e.g. CI → CI/CD).
       Tags missing from tags.json still render, under "Other". */
    const CONTACT_URL = 'https://contact.briancrink.com';
    const tagIndex = {
      categories: [],            // [{ id, label }] in display order
      byTag: new Map(),          // lower-case tag → category id
      aliases: new Map(),        // lower-case variant → canonical tag
      label(id) {
        const c = this.categories.find((x) => x.id === id);
        return c ? c.label : 'Other';
      },
      categoryOf(tag) {
        return this.byTag.get(String(tag).toLowerCase()) || 'other';
      },
      canonical(tag) {
        return this.aliases.get(String(tag).toLowerCase()) || tag;
      }
    };
    window.hireTags = tagIndex;

    function loadTagIndex(data) {
      const cats = (data && Array.isArray(data.categories)) ? data.categories : [];
      tagIndex.categories = cats.filter((c) => c && c.id).map((c) => ({ id: String(c.id), label: String(c.label || c.id) }));
      if (!tagIndex.categories.some((c) => c.id === 'other')) tagIndex.categories.push({ id: 'other', label: 'Other' });
      tagIndex.byTag = new Map(Object.entries((data && data.tags) || {}).map(([t, c]) => [t.toLowerCase(), String(c)]));
      tagIndex.aliases = new Map(Object.entries((data && data.aliases) || {}).map(([a, t]) => [a.toLowerCase(), String(t)]));
    }

    function canonicalTags(card) {
      const seen = new Set();
      card.tags = (card.tags || []).map((t) => tagIndex.canonical(String(t))).filter((t) => {
        const k = t.toLowerCase();
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
      return card;
    }

    // Group a card's tags into [{ id, label, tags }] in category order.
    function groupTags(tags) {
      const groups = new Map();
      tags.forEach((t) => {
        const id = tagIndex.categoryOf(t);
        if (!groups.has(id)) groups.set(id, []);
        groups.get(id).push(t);
      });
      const order = tagIndex.categories.map((c) => c.id);
      return Array.from(groups.entries())
        .sort((a, b) => (order.indexOf(a[0]) + 1 || 999) - (order.indexOf(b[0]) + 1 || 999))
        .map(([id, list]) => ({ id, label: tagIndex.label(id), tags: list }));
    }

    const BADGE_STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.7l5.9-.9z"/></svg>';

    function renderHireCard(card, mode) {
      const icon = card.icon || {};
      const chip = (tag) => '<span class="card-tag" data-tag="' + escapeHtml(tag) + '" title="Filter by ' + escapeHtml(tag) + '">' + escapeHtml(tag) + '</span>';
      const cats = groupTags(card.tags || []).map((g) =>
        '<div class="card-sec" data-cat="' + escapeHtml(g.id) + '">' +
          '<p class="card-label">' + escapeHtml(g.label) + '</p>' +
          '<div class="card-tags">' + g.tags.map(chip).join('') + '</div>' +
        '</div>'
      ).join('');
      const work = (card.work || []).map(cardLink).join('');
      const creds = (card.credentials || []).map(cardLink).join('');
      const badge = card.badge
        ? '<span class="card-badge">' + BADGE_STAR + escapeHtml(card.badge) + '</span>'
        : '';
      const contact = card.contact || CONTACT_URL;
      return (
        '<article class="hire-card" data-mode="' + escapeHtml(mode) + '">' +
          '<div class="card-top">' +
            '<svg class="card-icon" viewBox="' + escapeHtml(icon.viewBox || '0 0 24 24') + '" aria-hidden="true">' +
              '<path fill="currentColor" d="' + escapeHtml(icon.path || '') + '"/>' +
            '</svg>' + badge +
          '</div>' +
          '<h3 class="card-title">' + escapeHtml(card.title || '') + '</h3>' +
          '<p class="card-desc">' + escapeHtml(card.desc || '') + '</p>' +
          (cats ? '<div class="card-grid card-cats">' + cats + '</div>' : '') +
          '<div class="card-grid card-links">' +
            (work ? '<div class="card-sec"><p class="card-label">Featured Work</p><div class="card-work">' + work + '</div></div>' : '') +
            (creds ? '<div class="card-sec"><p class="card-label">Credentials</p><div class="card-creds">' + creds + '</div></div>' : '') +
          '</div>' +
          '<div class="card-foot">' +
            '<a class="card-cta" href="' + escapeHtml(contact) + '">Contact Brian</a>' +
          '</div>' +
        '</article>'
      );
    }

    function listCards(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.cards)) return data.cards;
      return [];
    }

    async function loadHireCards() {
      const board = document.getElementById('cardBoard');
      if (!board) return;
      const [rolesRes, servicesRes, tagsRes] = await Promise.all([
        fetch('roles.json', { cache: 'no-store' }),
        fetch('services.json', { cache: 'no-store' }),
        fetch('tags.json', { cache: 'no-store' }).catch(() => null)
      ]);
      if (!rolesRes.ok || !servicesRes.ok) {
        throw new Error('Could not load hire card data (roles.json / services.json)');
      }
      // Categories are optional: without tags.json every tag shows under "Other".
      loadTagIndex(tagsRes && tagsRes.ok ? await tagsRes.json().catch(() => null) : null);
      const roles = listCards(await rolesRes.json()).map(canonicalTags);
      const services = listCards(await servicesRes.json()).map(canonicalTags);
      board.innerHTML =
        roles.map(function (card) { return renderHireCard(card, 'roles'); }).join('') +
        services.map(function (card) { return renderHireCard(card, 'services'); }).join('');
      if (window.hireSearch) window.hireSearch.build(roles, services);
    }

    // Restart the jelly keyframes on the knob each time the view changes.
    // Removing the class + a reflow lets rapid toggles restart cleanly
    // instead of being ignored mid-animation.
    let toggleMode = null;
    function jellyKnob() {
      const knob = document.getElementById('toggleSlider');
      if (!knob) return;
      knob.classList.remove('is-jelly');
      void knob.offsetWidth;
      knob.classList.add('is-jelly');
    }
    document.getElementById('toggleSlider').addEventListener('animationend', (e) => {
      if (e.animationName === 'toggleJelly') e.currentTarget.classList.remove('is-jelly');
    });

    function applyMode(mode, pushHash) {
      const toggle = document.getElementById('modeToggle');
      const servicesOption = document.getElementById('servicesOption');
      const rolesOption = document.getElementById('rolesOption');
      const next = mode === 'services' ? 'services' : 'roles';

      if (toggleMode && toggleMode !== next) jellyKnob();
      toggleMode = next;

      if (next === 'services') {
        toggle.classList.add('services');
        rolesOption.classList.remove('active');
        rolesOption.classList.add('inactive');
        servicesOption.classList.remove('inactive');
        servicesOption.classList.add('active');
      } else {
        toggle.classList.remove('services');
        servicesOption.classList.remove('active');
        servicesOption.classList.add('inactive');
        rolesOption.classList.remove('inactive');
        rolesOption.classList.add('active');
      }

      if (pushHash) writeHash(next, false);
      syncCards(next);
      const search = document.getElementById('searchInput');
      if (search) search.placeholder = next === 'services' ? 'Search Services' : 'Search Roles';
    }

    function canWriteHistory() {
      try {
        return window.top === window && location.protocol !== 'about:' && location.origin !== 'null';
      } catch (err) {
        return false;
      }
    }

    function writeHash(mode, replace) {
      if (!canWriteHistory()) return;
      const hash = '#' + mode;
      try {
        if (replace) history.replaceState({ mode: mode }, '', hash);
        else if (location.hash !== hash) history.pushState({ mode: mode }, '', hash);
      } catch (err) {}
    }

    function switchMode(mode) {
      applyMode(mode, true);
    }

    window.addEventListener('hashchange', () => applyMode(modeFromHash(), false));
    window.addEventListener('popstate', () => applyMode(modeFromHash(), false));

    let cardObserver = null;
    let cardRevealTimer = 0;
    let cardsBooted = false;

    function clearCardObserver() {
      if (cardObserver) {
        cardObserver.disconnect();
        cardObserver = null;
      }
      if (cardRevealTimer) {
        clearTimeout(cardRevealTimer);
        cardRevealTimer = 0;
      }
    }

    function rowKey(card) {
      return Math.round(card.getBoundingClientRect().top);
    }

    function cardsByRow(cards) {
      const rows = [];
      cards.forEach((card) => {
        const top = rowKey(card);
        let row = rows.find((item) => Math.abs(item.top - top) < 12);
        if (!row) {
          row = { top: top, cards: [] };
          rows.push(row);
        }
        row.cards.push(card);
      });
      rows.sort((a, b) => a.top - b.top);
      return rows;
    }

    function headerReserve() {
      const tools = document.querySelector('.tools');
      if (!tools) return 220;
      return Math.max(0, Math.ceil(tools.getBoundingClientRect().bottom) + 16);
    }

    function revealRow(row) {
      const ordered = row.cards.slice().sort((a, b) => {
        return a.getBoundingClientRect().left - b.getBoundingClientRect().left;
      });
      ordered.forEach((card, i) => {
        window.setTimeout(() => {
          card.classList.add('is-in');
          rememberCardPositions();
        }, i * 180);
      });
    }

    function queueCardReveal() {
      clearCardObserver();
      const cards = Array.from(document.querySelectorAll('.hire-card.is-active'));
      cards.forEach((card) => card.classList.remove('is-in'));

      const isBoot = !cardsBooted;
      const hold = isBoot ? 400 : 80;
      cardsBooted = true;
      cardRevealTimer = window.setTimeout(() => {
        const rows = cardsByRow(cards);
        if (!rows.length) return;

        const topCut = headerReserve();
        const first = rows[0];
        const firstVisible = first.cards.some((card) => {
          const rect = card.getBoundingClientRect();
          return rect.top < window.innerHeight * 0.92 && rect.bottom > topCut;
        });
        if (firstVisible) revealRow(first);

        cardObserver = new IntersectionObserver((entries) => {
          const byRow = cardsByRow(cards);
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            const card = entry.target;
            const top = rowKey(card);
            const row = byRow.find((item) => Math.abs(item.top - top) < 12) || byRow.find((item) => item.cards.includes(card));
            if (!row) return;
            revealRow(row);
          });
        }, { root: scroller || null, threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
        cards.forEach((card) => cardObserver.observe(card));
      }, hold);
    }

    function syncCards(mode) {
      const wasBooted = cardsBooted;
      if (window.hireSearch) {
        // Applies mode + current query/tags to is-active, and re-ranks.
        window.hireSearch.setMode(mode);
      } else {
        document.querySelectorAll('.hire-card').forEach((card) => {
          card.classList.toggle('is-active', card.dataset.mode === mode);
        });
      }
      document.querySelectorAll('.hire-card').forEach((card) => {
        card.classList.remove('is-lit');
        card.style.transition = '';
        card.style.transform = '';
      });
      queueCardReveal();
      if (wasBooted && scroller) scroller.scrollTop = 0;
      requestAnimationFrame(updateScrollLock);
    }

    if (!location.hash) writeHash('roles', true);
    loadHireCards().then(function () {
      applyMode(modeFromHash(), false);
    }).catch(function (err) {
      console.error(err);
      const board = document.getElementById('cardBoard');
      if (board) board.textContent = 'Could not load hire card data (roles.json / services.json). Serve this folder over http.';
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable);
      if (typing) return;
      e.preventDefault();
      switchMode(e.key === 'ArrowRight' ? 'services' : 'roles');
    });

    const GRID = 24; //30
    const WELL = 16;
    const WELL_R = 64;
    const RIPPLE_AMP = 7;
    const RIPPLE_LEN = 22;
    const RIPPLE_SPEED = 2.4;
    const RIPPLE_DECAY = 120;
    const RIPPLE_OPACITY = 0.14;
    const GRID_ALPHA = 0.6;
    // Beyond this radius the well/ripple's pull on a grid point is well
    // under a pixel (env and pull both decay exponentially), so skipping
    // the trig there is free — visually identical, much cheaper.
    const WARP_CUTOFF = 340;
    const WARP_CUTOFF_SQ = WARP_CUTOFF * WARP_CUTOFF;
    const COLOR_STEPS = 20;

    const gridCanvas = document.getElementById('gridCanvas');
    const gridCtx = gridCanvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let canvasW = 0;
    let canvasH = 0;

    // Precomputed stroke colors bucketed by wave "crest" height, so the
    // draw loop looks a color up instead of building a fresh rgba()
    // string per segment (there can be 1000+ segments a frame).
    const rippleColors = new Array(COLOR_STEPS + 1);
    const GRID_THEME_MS = 450;
    let gridTheme = document.body.classList.contains('light') ? 1 : 0;
    let gridThemeFrom = gridTheme;
    let gridThemeTo = gridTheme;
    let gridThemeStart = 0;

    function mixRippleColors(u) {
      const t = u < 0 ? 0 : u > 1 ? 1 : u;
      for (let i = 0; i <= COLOR_STEPS; i++) {
        const lift = RIPPLE_OPACITY * (i / COLOR_STEPS);
        const g0 = 16 + lift * 140;
        const a0 = Math.min(0.9, GRID_ALPHA + lift);
        const g1 = 30 + lift * 40;
        const a1 = Math.min(0.16, 0.06 + lift * 0.08);
        const g = Math.round(g0 + (g1 - g0) * t);
        const a = a0 + (a1 - a0) * t;
        rippleColors[i] = 'rgba(' + g + ',' + g + ',' + g + ',' + a.toFixed(3) + ')';
      }
    }

    function startGridTheme(to) {
      gridThemeFrom = to > gridTheme ? Math.max(gridTheme, 0.7) : gridTheme;
      gridThemeTo = to;
      gridTheme = gridThemeFrom;
      gridThemeStart = performance.now();
      mixRippleColors(gridTheme);
    }

    function tickGridTheme(now) {
      if (!gridThemeStart) return;
      const raw = Math.min(1, (now - gridThemeStart) / GRID_THEME_MS);
      const goingLight = gridThemeTo > gridThemeFrom;
      const p = goingLight ? (1 - Math.pow(1 - raw, 3)) : Math.pow(raw, 3);
      gridTheme = gridThemeFrom + (gridThemeTo - gridThemeFrom) * p;
      mixRippleColors(gridTheme);
      if (raw >= 1) gridThemeStart = 0;
    }

    mixRippleColors(gridTheme);

    function snapHireDotToGrid() {
      const beacon = document.getElementById('hireBeacon');
      if (!beacon) return;

      beacon.style.transform = '';

      const rect = beacon.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const snapX = Math.round(cx / GRID) * GRID;
      beacon.style.transform = 'translateX(' + (snapX - cx) + 'px)';
    }

    function scheduleSnap() {
      requestAnimationFrame(snapHireDotToGrid);
    }

    // The beacon doesn't move with scroll (it lives in .stage, which is
    // never transformed by the header-collapse animation), so its screen
    // position is effectively constant between resizes. Caching it here
    // avoids a forced layout read (getBoundingClientRect) on every single
    // animation frame — previously the ripple loop's biggest hidden cost.
    let cachedOrigin = null;
    function invalidateBeaconOrigin() {
      cachedOrigin = null;
    }
    function beaconOrigin() {
      if (cachedOrigin) return cachedOrigin;
      const beacon = document.getElementById('hireBeacon');
      if (!beacon) {
        cachedOrigin = { x: canvasW * 0.5, y: canvasH * 0.24 };
        return cachedOrigin;
      }
      const rect = beacon.getBoundingClientRect();
      cachedOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      return cachedOrigin;
    }

    let ripplePointsCols = 0;
    let ripplePointsRows = 0;
    let ripplePX = null;
    let ripplePY = null;
    let rippleCrest = null;
    let ripplePaths = null;

    function resizeGridCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvasW = window.innerWidth;
      canvasH = window.innerHeight;
      gridCanvas.width = Math.floor(canvasW * dpr);
      gridCanvas.height = Math.floor(canvasH * dpr);
      gridCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ripplePointsCols = 0; // force the point cache to reallocate on next draw
    }

    // Reused every frame instead of allocating a fresh {x,y,crest} object
    // per grid point (there can be 1000+) — that allocation churn was a
    // real source of GC-pause jank at 60fps.
    function ensureRipplePoints(cols, rows) {
      if (ripplePointsCols === cols && ripplePointsRows === rows && ripplePX) return;
      const count = (cols + 1) * (rows + 1);
      ripplePX = new Float32Array(count);
      ripplePY = new Float32Array(count);
      rippleCrest = new Float32Array(count);
      ripplePointsCols = cols;
      ripplePointsRows = rows;
    }

    function drawWellRipple(now) {
      tickGridTheme(now);
      const t = now / 1000;
      const origin = beaconOrigin();
      const ox = origin.x;
      const oy = origin.y;
      const ctx = gridCtx;
      const cols = Math.ceil(canvasW / GRID) + 2;
      const rows = Math.ceil(canvasH / GRID) + 2;
      const stride = cols + 1;

      ensureRipplePoints(cols, rows);
      const px = ripplePX;
      const py = ripplePY;
      const crest = rippleCrest;

      for (let r = 0; r <= rows; r++) {
        const y = r * GRID;
        const rowBase = r * stride;
        for (let c = 0; c <= cols; c++) {
          const idx = rowBase + c;
          const x = c * GRID;
          const dx = x - ox;
          const dy = y - oy;
          const distSq = dx * dx + dy * dy;
          if (distSq > WARP_CUTOFF_SQ) {
            px[idx] = x;
            py[idx] = y;
            crest[idx] = 0;
            continue;
          }
          const dist = Math.sqrt(distSq) || 0.0001;
          const ux = dx / dist;
          const uy = dy / dist;
          const env = Math.exp(-dist / RIPPLE_DECAY);
          const wave = reduceMotion ? 0 : Math.sin(dist / RIPPLE_LEN - t * RIPPLE_SPEED);
          let pull = -WELL * Math.exp(-dist / WELL_R);
          if (!reduceMotion) pull += RIPPLE_AMP * wave * env;
          px[idx] = x + ux * pull;
          py[idx] = y + uy * pull;
          crest[idx] = Math.max(0, wave) * env;
        }
      }

      if (!ripplePaths) ripplePaths = new Array(COLOR_STEPS + 1);
      const paths = ripplePaths;
      for (let i = 0; i <= COLOR_STEPS; i++) paths[i] = null;

      function addSeg(ia, ib) {
        const c = (crest[ia] + crest[ib]) * 0.5;
        const bucket = c <= 0 ? 0 : Math.min(COLOR_STEPS, Math.round(c * COLOR_STEPS));
        let path = paths[bucket];
        if (!path) {
          path = new Path2D();
          paths[bucket] = path;
        }
        path.moveTo(px[ia], py[ia]);
        path.lineTo(px[ib], py[ib]);
      }

      for (let c = 0; c <= cols; c++) {
        for (let r = 0; r < rows; r++) {
          addSeg(r * stride + c, (r + 1) * stride + c);
        }
      }
      for (let r = 0; r <= rows; r++) {
        const rowBase = r * stride;
        for (let c = 0; c < cols; c++) {
          addSeg(rowBase + c, rowBase + c + 1);
        }
      }

      ctx.clearRect(0, 0, canvasW, canvasH);
      ctx.lineWidth = 1;
      ctx.lineJoin = 'round';
      for (let i = 0; i <= COLOR_STEPS; i++) {
        const path = paths[i];
        if (!path) continue;
        ctx.strokeStyle = rippleColors[i];
        ctx.stroke(path);
      }

      requestAnimationFrame(drawWellRipple);
    }

    function rememberCardPositions() {}

    function playCardReflow() {
      const cards = Array.from(document.querySelectorAll('.hire-card.is-active.is-in'));
      if (!cards.length) return;

      const first = cards.map((card) => ({ card: card, rect: card.getBoundingClientRect() }));
      first.forEach((item) => {
        item.card.style.transition = 'none';
        item.card.style.transform = 'none';
      });

      first.forEach((item) => {
        const last = item.card.getBoundingClientRect();
        const dx = item.rect.left - last.left;
        const dy = item.rect.top - last.top;
        if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) {
          item.card.style.transform = '';
          return;
        }
        item.card.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
      });

      void document.getElementById('cardBoard').offsetWidth;

      first.forEach((item) => {
        item.card.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)';
        item.card.style.transform = '';
      });
    }


    function cssPx(name, fallback) {
      const n = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
      return Number.isFinite(n) ? n : fallback;
    }

    function compactRangePx() { return cssPx('--compact-range', 160); }

    function activeCards() {
      return Array.from(document.querySelectorAll('.hire-card.is-active'));
    }

    // Bottom edge of the fixed header chrome: the tag strip under the search
    // bar (falls back to the bar itself if the strip is missing).
    function chromeEdgeEl() {
      return document.getElementById('tagStrip')
        || document.getElementById('searchBar')
        || document.querySelector('.search-bar');
    }

    /* ---------------------------------------------------------------
       Scrolling — same model as site.briancrink.com/map:
       #scroller is a plain native scroll container pinned under the
       header. Scrolling sets --hero-compact (0 → 1 over --compact-range),
       the header collapses with it, and --chrome-expanded is re-measured
       so the scroller always starts right under the header. Wheel input
       over the header is forwarded to the scroller. No snapping, no
       programmatic scroll animation, no fade mask, no spacer.

       One extra rule kept from before: when every visible card fits in a
       single row below the expanded header (or nothing matches), the
       scroller is set to overflow: hidden — nothing to scroll.
       --------------------------------------------------------------- */
    const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
    let lastCompact = -1;

    function syncMemojiClip() {
      const img = document.querySelector('.dev-image');
      const toggle = document.getElementById('modeToggle');
      if (!img || !toggle) return;
      const ir = img.getBoundingClientRect();
      const cut = toggle.getBoundingClientRect().bottom;
      const fade = 28;
      if (cut >= ir.bottom - 0.5) {
        img.style.opacity = '1';
        img.style.webkitMaskImage = 'none';
        img.style.maskImage = 'none';
        return;
      }
      if (cut <= ir.top + 0.5) {
        img.style.opacity = '0';
        img.style.webkitMaskImage = 'none';
        img.style.maskImage = 'none';
        return;
      }
      img.style.opacity = '1';
      const solid = Math.max(0, cut - ir.top - fade);
      const end = Math.max(0, cut - ir.top);
      const mask = 'linear-gradient(to bottom, #000 0, #000 ' + solid + 'px, transparent ' + end + 'px, transparent 100%)';
      img.style.webkitMaskImage = mask;
      img.style.maskImage = mask;
    }

    function measureChrome() {
      const edge = chromeEdgeEl() || document.getElementById('modeToggle');
      if (!edge) return;
      const h = Math.ceil(edge.getBoundingClientRect().bottom);
      document.documentElement.style.setProperty('--chrome-expanded', Math.max(0, h) + 'px');
    }

    function syncHeroCompact() {
      const range = Math.max(1, compactRangePx());
      const y = scrollYNow();
      const t = Math.min(1, Math.max(0, y / range));
      const rounded = t.toFixed(4);
      const cancel = Math.min(y, range);
      document.documentElement.style.setProperty('--scroll-cancel', cancel + 'px');
      if (rounded !== lastCompact) {
        lastCompact = rounded;
        document.documentElement.style.setProperty('--hero-compact', rounded);
        syncMemojiClip();
        measureChrome();
      }
    }

    // True when every visible card sits in one row that fits below the fully
    // expanded header (measured as if scrolled to the top), or nothing matches.
    function singleRowFits() {
      const cards = activeCards();
      if (!cards.length) return true;
      let firstTop = null;
      let maxBottom = 0;
      for (const card of cards) {
        const top = card.offsetTop; // layout position, ignores reveal transforms
        if (firstTop === null) firstTop = top;
        else if (Math.abs(top - firstTop) > 6) return false;
        maxBottom = Math.max(maxBottom, top + card.offsetHeight);
      }
      const edge = chromeEdgeEl();
      if (!edge) return false;
      const compact = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hero-compact')) || 0;
      const expandedEdge = edge.getBoundingClientRect().bottom + compact * cssPx('--tool-collapse', 170);
      return expandedEdge + maxBottom + 24 <= window.innerHeight;
    }

    function updateScrollLock() {
      const lock = singleRowFits();
      if (lock === scrollLocked) return;
      scrollLocked = lock;
      document.documentElement.classList.toggle('scroll-locked', lock);
      if (lock && scroller) {
        scroller.scrollTop = 0;
        syncHeroCompact();
      }
    }

    // Cards fade in as they scroll into view (IntersectionObserver above).
    // A fast flick can carry a row past the viewport between two frames, so
    // the observer never sees it intersect — reveal anything already passed.
    function revealPassed() {
      if (!cardsBooted) return;
      const pending = document.querySelectorAll('.hire-card.is-active:not(.is-in)');
      if (!pending.length) return;
      const limit = window.innerHeight * 0.92;
      pending.forEach((card) => {
        if (card.getBoundingClientRect().top < limit) card.classList.add('is-in');
      });
    }

    if (scroller) {
      scroller.addEventListener('scroll', () => {
        requestAnimationFrame(() => {
          syncHeroCompact();
          revealPassed();
        });
      }, { passive: true });
    }
    ['.stage', '.tools', '.theme-toggle'].forEach((sel) => {
      const el = document.querySelector(sel);
      if (!el || !scroller) return;
      el.addEventListener('wheel', (e) => {
        if (scrollLocked) return;
        // The search menus and the tag strip scroll themselves.
        if (e.target && e.target.closest && e.target.closest('.overlay-box, .tag-strip')) return;
        scroller.scrollTop += e.deltaY;
      }, { passive: true });
    });

    measureChrome();
    syncHeroCompact();
    requestAnimationFrame(() => {
      measureChrome();
      syncMemojiClip();
    });
    const toolsEl = document.querySelector('.tools');
    if (window.ResizeObserver && toolsEl) {
      new ResizeObserver(() => measureChrome()).observe(toolsEl);
    }
    const heroImg = document.querySelector('.dev-image');
    if (heroImg && !heroImg.complete) {
      heroImg.addEventListener('load', measureChrome, { once: true });
    }

    window.addEventListener('load', scheduleSnap);
    window.addEventListener('load', () => {
      invalidateBeaconOrigin();
      measureChrome();
      updateScrollLock();
    });
    let lastInnerW = window.innerWidth;
    window.addEventListener('resize', () => {
      resizeGridCanvas();
      invalidateBeaconOrigin();
      scheduleSnap();
      measureChrome();
      syncMemojiClip();
      updateScrollLock();
      const widthChanged = window.innerWidth !== lastInnerW;
      lastInnerW = window.innerWidth;
      if (widthChanged) playCardReflow();
    });
    if (window.ResizeObserver && !coarsePointer) {
      new ResizeObserver(() => playCardReflow()).observe(document.getElementById('cardBoard'));
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        invalidateBeaconOrigin();
        scheduleSnap();
        measureChrome();
        updateScrollLock();
      });
    }

    resizeGridCanvas();
    requestAnimationFrame(drawWellRipple);

    const dots = document.querySelector('.dots');
    const toggle = document.getElementById('modeToggle');
    const searchInput = document.getElementById('searchInput');

    function activateDots() {
      // dots.classList.add('interactive');
    }

    function deactivateDots() {
      // dots.classList.remove('interactive');
    }


    function clearLit(except) {
      document.querySelectorAll('.hire-card.is-lit').forEach((el) => {
        if (el !== except) el.classList.remove('is-lit');
      });
    }

    // Selecting a card brings its row up to the top-row position (where the
    // first row sits when the page is at the top). Native smooth scroll, so
    // any wheel/touch input from the person simply takes over. Uses 'click',
    // not 'pointerdown', so starting a swipe over a card on a phone doesn't
    // select it or move the page.
    function scrollRowToTop(card) {
      if (!scroller || scrollLocked || !card) return;
      const flow = document.getElementById('pageFlow');
      const padTop = flow ? parseFloat(getComputedStyle(flow).paddingTop) || 0 : 0;
      const max = scroller.scrollHeight - scroller.clientHeight;
      const target = Math.max(0, Math.min(max, card.offsetTop - padTop));
      if (Math.abs(target - scroller.scrollTop) < 2) return;
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      scroller.scrollTo({ top: target, behavior: reduce ? 'auto' : 'smooth' });
    }

    document.getElementById('cardBoard').addEventListener('click', (e) => {
      if (e.target.closest('.card-tag')) return;   // tag click filters instead
      if (e.target.closest('a, button')) return;   // links keep their own job
      const card = e.target.closest('.hire-card.is-active');
      if (!card) return;
      clearLit(card);
      card.classList.add('is-lit');
      scrollRowToTop(card);
    });

    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.hire-card')) return;
      clearLit();
    });

    searchInput.addEventListener('focus', activateDots);
    searchInput.addEventListener('blur', deactivateDots);

    toggle.addEventListener('mouseenter', activateDots);
    toggle.addEventListener('mouseleave', deactivateDots);

    /* =================================================================
       Search
       -----------------------------------------------------------------
       Layered on top of the shared resources/search-bar component (which
       only animates the bar and toggles #overlayBox). Everything here is
       scoped in an IIFE because search-bar.js already owns globals like
       `input`, `overlay`, `menuBtn` and `cmdBtn`.

       Query syntax (searches the current Roles / Services view):
         word            title, tags, featured work, description (ranked)
         "exact phrase"  phrase match
         #tag  tag:x     must carry a tag (prefix match)
         title:x         title only        desc:x   description only
         work:x          featured work / project (alias project:, p:)
         link:x          any link label or URL
         -word  -#tag    exclude
         >               command palette
       ================================================================= */
    window.hireSearch = (function () {
      const qInput = document.getElementById('searchInput');
      const qBar = document.getElementById('searchBar');
      const qWrap = document.getElementById('searchWrapper');
      const qOverlay = document.getElementById('overlayBox');
      const qMenuBtn = document.getElementById('menuIcon');
      const qCmdBtn = document.getElementById('commandIcon');
      const qClear = document.getElementById('searchClear');
      const tagStrip = document.getElementById('tagStrip');
      const emptyBox = document.getElementById('emptyState');
      const board = document.getElementById('cardBoard');
      if (!qInput || !qOverlay || !tagStrip || !board) return null;

      const MODE_LABEL = { roles: 'Roles', services: 'Services' };
      const MODE_ONE = { roles: 'role', services: 'service' };
      const FIELD = {
        tag: 'tag', tags: 'tag', t: 'tag',
        title: 'title', name: 'title', role: 'title', service: 'title',
        desc: 'desc', d: 'desc', about: 'desc',
        work: 'work', project: 'work', projects: 'work', p: 'work',
        link: 'link', url: 'link', site: 'link',
        cat: 'cat', category: 'cat', type: 'cat', kind: 'cat',
        is: 'badge', badge: 'badge'
      };
      const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
      const CMD_KEY = IS_MAC ? '⌘K' : 'Ctrl K';

      const state = { mode: 'roles', query: '', tags: [], sort: 'relevance' };
      let models = [];
      let results = [];
      let parsed = { terms: [], command: null };
      let overlayMode = null; // 'menu' | 'commands' | 'command-query' | 'suggest'
      let ovActions = [];
      let ovSel = 0;
      let kbNav = false;
      let suggestCtx = null;
      let flipTimer = 0;
      let urlTimer = 0;

      /* ---------- helpers ---------- */
      function norm(s) {
        return String(s == null ? '' : s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '');
      }
      function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
      function kbd(k) { return '<kbd>' + k + '</kbd>'; }
      function inMode(mode) { return models.filter((m) => m.mode === mode); }

      // Edit distance with adjacent transpositions ("pyhton" → "python" = 1).
      function lev(a, b, max) {
        if (a === b) return 0;
        let prev2 = null;
        let prev = new Array(b.length + 1);
        for (let j = 0; j <= b.length; j++) prev[j] = j;
        for (let i = 1; i <= a.length; i++) {
          const cur = [i];
          let rowMin = i;
          for (let j = 1; j <= b.length; j++) {
            let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
            if (prev2 && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, prev2[j - 2] + 1);
            cur[j] = v;
            if (v < rowMin) rowMin = v;
          }
          if (rowMin > max) return max + 1;
          prev2 = prev;
          prev = cur;
        }
        return prev[b.length];
      }

      /* ---------- index ---------- */
      function build(roles, services) {
        const els = Array.from(board.querySelectorAll('.hire-card'));
        const data = roles.map((c) => ['roles', c]).concat(services.map((c) => ['services', c]));
        models = data.map(([mode, card], i) => {
          const el = els[i];
          const tags = (card.tags || []).map(String);
          const work = (card.work || []).filter((w) => w && w.url);
          const actions = (card.credentials || card.actions || []).filter((a) => a && a.url);
          const tagCats = tags.map((t) => (window.hireTags ? window.hireTags.categoryOf(t) : 'other'));
          const m = {
            i, mode, el,
            title: String(card.title || ''),
            desc: String(card.desc || ''),
            titleL: norm(card.title),
            descL: norm(card.desc),
            tags, tagsL: tags.map(norm),
            work: work.map((w) => String(w.label || w.url)),
            workL: work.map((w) => norm(w.label || w.url)),
            workUrlL: work.map((w) => norm(w.url)),
            linkL: work.concat(actions).map((a) => norm((a.label || '') + ' ' + a.url)),
            catsL: Array.from(new Set(tagCats.flatMap((id) => [norm(id), norm(window.hireTags ? window.hireTags.label(id) : id)]))),
            badgeL: norm(card.badge || ''),
            titleEl: el.querySelector('.card-title'),
            descEl: el.querySelector('.card-desc'),
            tagEls: Array.from(el.querySelectorAll('.card-tag')),
            workEls: Array.from(el.querySelectorAll('.card-work a')),
            hlKey: ''
          };
          m.words = Array.from(new Set((m.titleL + ' ' + m.tagsL.join(' ')).split(/[^a-z0-9.+#]+/).filter((w) => w.length > 2)));
          return m;
        });
      }

      function modeTags(mode) {
        const map = new Map();
        inMode(mode).forEach((m) => m.tags.forEach((label, k) => {
          const key = m.tagsL[k];
          const e = map.get(key) || { key, label, total: 0 };
          e.total++;
          map.set(key, e);
        }));
        return Array.from(map.values()).sort((a, b) => b.total - a.total || a.label.localeCompare(b.label));
      }

      function modeProjects(mode) {
        const map = new Map();
        inMode(mode).forEach((m) => m.work.forEach((label, k) => {
          const key = m.workL[k];
          const e = map.get(key) || { key, label, total: 0 };
          e.total++;
          map.set(key, e);
        }));
        return Array.from(map.values()).sort((a, b) => b.total - a.total || a.label.localeCompare(b.label));
      }

      /* ---------- query ---------- */
      function parseQuery(raw) {
        const text = String(raw || '').trim();
        if (text.charAt(0) === '>') return { terms: [], command: text.slice(1).trim() };
        const terms = [];
        const re = /(-)?(?:([a-z]+):)?(?:"([^"]*)"?|(\S+))/gi;
        let mm;
        while ((mm = re.exec(text))) {
          if (!mm[0]) { re.lastIndex++; continue; }
          const neg = !!mm[1];
          let field = mm[2] ? FIELD[mm[2].toLowerCase()] : null;
          let value = mm[3] != null ? mm[3] : (mm[4] || '');
          const phrase = mm[3] != null;
          if (mm[2] && !field) value = mm[2] + ':' + value;              // unknown prefix: plain text (e.g. a URL)
          if (!field && !phrase && /^[a-z]+:$/i.test(value) && FIELD[value.slice(0, -1).toLowerCase()]) continue; // "tag:" still being typed
          if (!field && !phrase && value.charAt(0) === '#') { field = 'tag'; value = value.slice(1); }
          value = norm(value).trim();
          if (!value || value === '-') continue;
          terms.push({ neg, field, value, phrase, re: new RegExp('(^|[^a-z0-9])' + escRe(value)) });
        }
        return { terms, command: null };
      }

      function textScore(hay, t, exact, prefix, sub) {
        if (!hay) return 0;
        if (hay === t.value) return exact;
        if (t.re.test(hay)) return prefix;
        return hay.indexOf(t.value) !== -1 ? sub : 0;
      }

      function listScore(list, t, exact, prefix, sub) {
        let best = 0;
        for (const hay of list) {
          const s = textScore(hay, t, exact, prefix, sub);
          if (s > best) best = s;
        }
        return best;
      }

      function fuzzy(m, t) {
        if (t.phrase || t.value.length < 4) return 0;
        const max = t.value.length >= 7 ? 2 : 1;
        for (const w of m.words) {
          if (Math.abs(w.length - t.value.length) <= max && lev(w, t.value, max) <= max) return 1;
        }
        return 0;
      }

      function scoreTerm(m, t) {
        switch (t.field) {
          case 'tag': return listScore(m.tagsL, t, 9, 6, 3);
          case 'title': return textScore(m.titleL, t, 10, 8, 5);
          case 'desc': return textScore(m.descL, t, 4, 3, 2);
          case 'work': return listScore(m.workL, t, 7, 5, 3) || listScore(m.workUrlL, t, 2, 2, 2);
          case 'link': return listScore(m.linkL, t, 3, 3, 2);
          case 'cat': return listScore(m.catsL, t, 6, 5, 3);
          case 'badge': return textScore(m.badgeL, t, 6, 5, 3);
          default: {
            const parts = [
              textScore(m.titleL, t, 12, 8, 5),
              listScore(m.tagsL, t, 9, 6, 3),
              listScore(m.workL, t, 6, 4, 2),
              textScore(m.descL, t, 4, 3, 2),
              textScore(m.badgeL, t, 4, 3, 0)
            ];
            const best = Math.max.apply(null, parts);
            if (best) return best + parts.filter(Boolean).length * 0.25;
            return fuzzy(m, t);
          }
        }
      }

      function matchCard(m, terms, tags) {
        if (tags && tags.length && !tags.every((k) => m.tagsL.indexOf(k) !== -1)) return -1;
        let score = 0;
        for (const t of terms) {
          const s = scoreTerm(m, t);
          if (t.neg) { if (s > 1) return -1; continue; }
          if (!s) return -1;
          score += s;
        }
        return score;
      }

      function countFor(mode) {
        if (mode === state.mode) return results.length;
        return inMode(mode).filter((m) => matchCard(m, parsed.terms, state.tags) >= 0).length;
      }

      /* ---------- compute + paint ---------- */
      function compute() {
        parsed = parseQuery(state.query);
        const terms = parsed.terms;
        results = [];
        models.forEach((m) => {
          const score = m.mode === state.mode ? matchCard(m, terms, state.tags) : -1;
          m.score = score;
          const ok = score >= 0;
          m.el.classList.toggle('is-active', ok);
          if (ok) results.push(m);
        });
        const hasText = terms.some((t) => !t.neg);
        if (state.sort === 'az') results.sort((a, b) => a.title.localeCompare(b.title));
        else if (state.sort === 'relevance' && hasText) results.sort((a, b) => b.score - a.score || a.i - b.i);
        else results.sort((a, b) => a.i - b.i);
        models.forEach((m) => { if (m.score < 0) m.el.style.order = ''; });
        results.forEach((m, k) => { m.el.style.order = String(k); });
        paintHighlights(terms);
        return results;
      }

      function markText(text, vals) {
        const escapeHtmlLocal = escapeHtml;
        if (!vals.length) return escapeHtmlLocal(text);
        const re = new RegExp('(' + vals.map(escRe).join('|') + ')', 'gi');
        let out = '';
        let last = 0;
        let mm;
        while ((mm = re.exec(text))) {
          if (!mm[0]) { re.lastIndex++; continue; }
          out += escapeHtmlLocal(text.slice(last, mm.index)) + '<mark class="hl">' + escapeHtmlLocal(mm[0]) + '</mark>';
          last = mm.index + mm[0].length;
        }
        return out + escapeHtmlLocal(text.slice(last));
      }

      function paintHighlights(terms) {
        const pos = terms.filter((t) => !t.neg);
        const byLen = (a, b) => b.length - a.length;
        const titleVals = pos.filter((t) => !t.field || t.field === 'title').map((t) => t.value).filter((v) => v.length > 1).sort(byLen);
        const descVals = pos.filter((t) => !t.field || t.field === 'desc').map((t) => t.value).filter((v) => v.length > 1).sort(byLen);
        const tagTerms = pos.filter((t) => !t.field || t.field === 'tag');
        const workTerms = pos.filter((t) => !t.field || t.field === 'work');
        const on = new Set(state.tags);
        const key = titleVals.join('|') + '#' + descVals.join('|') + '#' + tagTerms.map((t) => t.value).join('|') + '#' + workTerms.map((t) => t.value).join('|') + '#' + state.tags.join('|');
        results.forEach((m) => {
          if (m.hlKey === key) return;
          m.hlKey = key;
          if (m.titleEl) m.titleEl.innerHTML = markText(m.title, titleVals);
          if (m.descEl) m.descEl.innerHTML = markText(m.desc, descVals);
          m.tagEls.forEach((el, k) => {
            const t = norm(el.dataset.tag);
            el.classList.toggle('is-on', on.has(t));
            el.classList.toggle('is-match', !on.has(t) && tagTerms.some((term) => textScore(t, term, 1, 1, term.field ? 1 : 0) > 0));
          });
          m.workEls.forEach((el, k) => {
            const w = m.workL[k];
            el.classList.toggle('is-match', !!w && workTerms.some((term) => textScore(w, term, 1, 1, term.field ? 1 : 0) > 0));
          });
        });
      }

      /* ---------- tag strip + empty state ---------- */
      function renderTags() {
        const all = modeTags(state.mode);
        const counts = new Map();
        results.forEach((m) => m.tagsL.forEach((k) => counts.set(k, (counts.get(k) || 0) + 1)));
        const on = new Set(state.tags);
        const total = inMode(state.mode).length;
        const filtered = !!(state.tags.length || parsed.terms.length);
        const ordered = all.filter((t) => on.has(t.key)).concat(all.filter((t) => !on.has(t.key)));
        let html = '<button type="button" class="tag-chip is-all' + (filtered ? '' : ' is-on') + '" data-act="clear" title="' + (filtered ? 'Clear search and tags' : 'All ' + MODE_LABEL[state.mode]) + '">'
          + 'All ' + MODE_LABEL[state.mode] + ' <span class="n">' + (filtered ? results.length + '/' + total : total) + '</span></button>';
        ordered.forEach((t) => {
          const isOn = on.has(t.key);
          const n = counts.get(t.key) || 0;
          html += '<button type="button" class="tag-chip' + (isOn ? ' is-on' : '') + (!n && !isOn ? ' is-empty' : '') + '"'
            + ' data-tag="' + escapeHtml(t.key) + '" aria-pressed="' + isOn + '">'
            + escapeHtml(t.label) + ' <span class="n">' + n + '</span></button>';
        });
        const sl = tagStrip.scrollLeft;
        tagStrip.innerHTML = html;
        tagStrip.scrollLeft = sl;
      }

      function describeFilters() {
        const bits = [];
        if (parsed.terms.length) bits.push('“' + escapeHtml(state.query.trim()) + '”');
        if (state.tags.length) {
          const labels = new Map(modeTags(state.mode).map((t) => [t.key, t.label]));
          bits.push(state.tags.map((k) => '#' + escapeHtml(labels.get(k) || k)).join(' '));
        }
        return bits.join(' + ');
      }

      function renderEmpty() {
        if (!emptyBox) return;
        if (results.length || !models.length) {
          emptyBox.classList.remove('show');
          emptyBox.innerHTML = '';
          return;
        }
        const other = state.mode === 'roles' ? 'services' : 'roles';
        const n = countFor(other);
        let actions = '<button type="button" data-act="clear">Clear search</button>';
        if (state.tags.length && parsed.terms.length) actions += '<button type="button" data-act="tags">Remove tags</button>';
        if (n) actions += '<button type="button" data-act="mode:' + other + '">See ' + n + ' matching ' + (n === 1 ? MODE_ONE[other] : other) + ' →</button>';
        emptyBox.innerHTML = '<h3>No ' + MODE_LABEL[state.mode].toLowerCase() + ' match</h3>'
          + '<p>Nothing in ' + MODE_LABEL[state.mode] + ' matches ' + describeFilters() + '.'
          + (n ? '' : ' Try fewer words, a tag, or <code>#</code> to browse tags.') + '</p>'
          + '<div class="empty-actions">' + actions + '</div>';
        emptyBox.classList.add('show');
      }

      function syncUI() {
        if (qBar) qBar.classList.toggle('has-query', !!state.query);
        renderTags();
        renderEmpty();
        if (overlayMode === 'menu') renderOverlay();
      }

      /* ---------- url ---------- */
      function writeUrl() {
        if (typeof canWriteHistory === 'function' && !canWriteHistory()) return;
        const p = new URLSearchParams();
        if (state.query && !parsed.command) p.set('q', state.query.trim());
        state.tags.forEach((t) => p.append('tag', t));
        if (state.sort !== 'relevance') p.set('sort', state.sort);
        const qs = p.toString();
        try { history.replaceState(history.state, '', location.pathname + (qs ? '?' + qs : '') + location.hash); } catch (err) {}
      }
      function writeUrlSoon() {
        window.clearTimeout(urlTimer);
        urlTimer = window.setTimeout(writeUrl, 250);
      }
      function readUrl() {
        const p = new URLSearchParams(location.search);
        state.query = p.get('q') || '';
        state.tags = Array.from(new Set(p.getAll('tag').map(norm).filter(Boolean)));
        const s = p.get('sort');
        if (s === 'az' || s === 'original') state.sort = s;
        qInput.value = state.query;
        parsed = parseQuery(state.query);
      }

      /* ---------- state changes ---------- */
      // Filter / sort changed in place: FLIP the cards that stay, fade in
      // the ones that appear, keep the hero state, re-check scroll lock.
      function refresh() {
        if (!models.length) return;
        const before = new Map();
        activeCards().forEach((c) => {
          if (c.classList.contains('is-in')) before.set(c, c.getBoundingClientRect());
        });
        compute();
        // Results always start at the top of the board.
        if (scroller && scroller.scrollTop > 0) scroller.scrollTop = 0;
        updateScrollLock();
        const now = activeCards();
        const fresh = [];
        const moved = [];
        now.forEach((c) => {
          c.classList.remove('is-lit');
          const a = before.get(c);
          if (!a) {
            c.classList.remove('is-in');
            fresh.push(c);
            return;
          }
          const b = c.getBoundingClientRect();
          const dx = a.left - b.left;
          const dy = a.top - b.top;
          if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
          c.style.transition = 'none';
          c.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
          moved.push(c);
        });
        if (moved.length) {
          void board.offsetWidth;
          moved.forEach((c) => {
            c.style.transition = 'transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease, background 0.2s ease, border-color 0.2s ease';
            c.style.transform = '';
          });
          window.clearTimeout(flipTimer);
          flipTimer = window.setTimeout(() => moved.forEach((c) => { c.style.transition = ''; }), 460);
        }
        fresh.sort((a, b) => (+a.style.order) - (+b.style.order))
          .forEach((c, k) => window.setTimeout(() => {
            if (c.classList.contains('is-active')) c.classList.add('is-in');
          }, 30 + Math.min(k, 10) * 35));
        syncUI();
        writeUrlSoon();
      }

      function setMode(mode) {
        state.mode = mode === 'services' ? 'services' : 'roles';
        if (!models.length) return;
        const keys = new Set(modeTags(state.mode).map((t) => t.key));
        state.tags = state.tags.filter((k) => keys.has(k));
        compute();
        syncUI();
        writeUrlSoon();
      }

      function setQuery(v) {
        qInput.value = v;
        state.query = v;
        if (qBar) qBar.classList.toggle('has-query', !!v);
        refresh();
      }

      function toggleTag(raw, force) {
        const key = norm(raw);
        if (!key) return;
        const has = state.tags.indexOf(key) !== -1;
        if (has && force !== true) state.tags = state.tags.filter((k) => k !== key);
        else if (!has) state.tags = state.tags.concat(key);
        refresh();
        if (!has) tagStrip.scrollLeft = 0;
      }

      function clearAll() {
        state.tags = [];
        setQuery('');
      }

      function setSort(s) {
        state.sort = s;
        refresh();
      }

      function workTermRe(key) {
        return new RegExp('(^|\\s)(?:work|project|projects|p):(?:"' + escRe(key) + '"|' + escRe(key) + ')(?=\\s|$)', 'i');
      }

      function toggleProject(label) {
        const key = norm(label);
        const re = workTermRe(key);
        if (re.test(norm(state.query))) {
          setQuery(state.query.replace(new RegExp(re.source, 'i'), ' ').replace(/\s+/g, ' ').trim());
        } else {
          const val = /\s/.test(label) ? '"' + label + '"' : label;
          const q = state.query.trim();
          setQuery((q ? q + ' ' : '') + 'work:' + val);
        }
      }

      function insertText(s) {
        const v = qInput.value;
        qInput.value = (v && !/\s$/.test(v) ? v + ' ' : v) + s;
        qInput.focus();
        const end = qInput.value.length;
        try { qInput.setSelectionRange(end, end); } catch (err) {}
        qInput.dispatchEvent(new Event('input', { bubbles: true }));
      }

      function focusFirst() {
        const first = results[0];
        if (!first) return;
        if (typeof clearLit === 'function') clearLit(first.el);
        first.el.classList.add('is-lit');
      }

      function go(url) { window.location.href = url; }

      function copyLink(el) {
        writeUrl();
        const done = () => {
          const label = el && el.querySelector('.ov-label');
          if (label) label.textContent = 'Link copied ✓';
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(location.href).then(done, () => {});
        }
      }

      /* ---------- overlay (menu, commands, suggestions) ---------- */
      function btn(label, o) {
        const idx = ovActions.push(o.run) - 1;
        return '<button type="button" tabindex="-1" class="ov-item' + (o.on ? ' is-on' : '') + '" data-ov="' + idx + '">'
          + '<span class="ov-ico">' + (o.icon || '') + '</span>'
          + '<span class="ov-label">' + label + '</span>'
          + (o.hint != null && o.hint !== '' ? '<span class="ov-hint">' + o.hint + '</span>' : '')
          + '</button>';
      }

      function chip(label, n, on, run) {
        const idx = ovActions.push(run) - 1;
        return '<button type="button" tabindex="-1" class="tag-chip' + (on ? ' is-on' : '') + (!n && !on ? ' is-empty' : '') + '" data-ov="' + idx + '">'
          + escapeHtml(label) + ' <span class="n">' + n + '</span></button>';
      }

      function section(head, body) {
        return '<div class="ov-section">' + (head ? '<div class="ov-head">' + head + '</div>' : '') + body + '</div>';
      }

      function foot() {
        return '<div class="ov-foot"><span>' + kbd('/') + ' search</span><span>' + kbd(CMD_KEY) + ' commands</span>'
          + '<span>' + kbd('←') + kbd('→') + ' view</span><span>' + kbd('↑') + kbd('↓') + ' ' + kbd('↵') + ' pick</span><span>' + kbd('Esc') + ' clear</span></div>';
      }

      function commandList() {
        const other = state.mode === 'roles' ? 'services' : 'roles';
        const list = [];
        list.push({ label: 'Show ' + MODE_LABEL[other], icon: '⇄', hint: kbd(other === 'services' ? '→' : '←'), k: 'switch view toggle mode ' + other, run: () => switchMode(other) });
        if (state.query.trim() && !parsed.command || state.tags.length) {
          list.push({ label: 'Clear search & tags', icon: '✕', hint: kbd('Esc'), k: 'clear reset remove filters', run: clearAll });
        }
        if (results.length && (parsed.terms.length || state.tags.length)) {
          list.push({ label: 'Jump to top result', icon: '↓', hint: escapeHtml(results[0].title), k: 'first top result jump go', run: focusFirst });
        }
        list.push({ label: 'Sort by relevance', icon: '↯', on: state.sort === 'relevance', keep: true, k: 'sort relevance best ranking', run: () => setSort('relevance') });
        list.push({ label: 'Sort A–Z', icon: 'A', on: state.sort === 'az', keep: true, k: 'sort alphabetical a-z az name', run: () => setSort('az') });
        list.push({ label: 'Original order', icon: '≣', on: state.sort === 'original', keep: true, k: 'sort original default order', run: () => setSort('original') });
        list.push({ label: document.body.classList.contains('light') ? 'Switch to dark theme' : 'Switch to light theme', icon: '◐', keep: true, k: 'theme light dark appearance', run: () => { const b = document.getElementById('theme-toggle'); if (b) b.click(); } });
        list.push({ label: 'Copy link to this view', icon: '⧉', keep: 'static', k: 'copy share link url', run: copyLink });
        list.push({ label: 'Resume', icon: '↗', k: 'resume cv experience', run: () => go('https://hire.briancrink.com/resume/') });
        list.push({ label: 'Contact', icon: '↗', k: 'contact email message hire reach', run: () => go('https://contact.briancrink.com') });
        list.push({ label: 'CareerOS', icon: '↗', k: 'career os careeros', run: () => go('https://os.briancrink.com/career') });
        list.push({ label: 'Portal', icon: '↗', k: 'portal home', run: () => go('https://portal.briancrink.com#career') });
        list.push({ label: 'Site map', icon: '↗', k: 'site map sitemap pages', run: () => go('https://site.briancrink.com/map') });
        return list;
      }

      function runCmd(c, el) {
        const fromQuery = overlayMode === 'command-query';
        c.run(el);
        if (fromQuery) {
          closeOverlay();
          setQuery('');
        } else if (c.keep === 'static') {
          // leave as-is (e.g. "Link copied ✓")
        } else if (c.keep) {
          renderOverlay();
        } else {
          closeOverlay();
        }
      }

      function suggestionFor() {
        const v = qInput.value;
        if (qInput.selectionEnd != null && qInput.selectionEnd !== v.length) return null;
        const mm = /(^|\s)(-?)(#|tags?:|t:|work:|projects?:|p:)([^\s"]*)$/i.exec(v);
        if (!mm) return null;
        const kind = mm[3] === '#' || /^t/i.test(mm[3]) ? 'tag' : 'work';
        return { kind, neg: !!mm[2], q: norm(mm[4]), start: mm.index + mm[1].length };
      }

      function applySuggestion(kind, label) {
        const s = suggestCtx;
        if (!s) return;
        const head = qInput.value.slice(0, s.start).replace(/\s+$/, '');
        closeOverlay();
        if (kind === 'tag' && !s.neg) {
          qInput.value = head ? head + ' ' : '';
          state.query = qInput.value;
          toggleTag(label, true);
        } else {
          const val = /\s/.test(label) ? '"' + label + '"' : label;
          setQuery((head ? head + ' ' : '') + (s.neg ? '-' : '') + (kind === 'tag' ? 'tag:' : 'work:') + val + ' ');
        }
        qInput.focus();
      }

      function renderOverlay() {
        ovActions = [];
        let html = '';
        if (overlayMode === 'commands' || overlayMode === 'command-query') {
          const words = overlayMode === 'command-query' ? norm(parsed.command || '').split(/\s+/).filter(Boolean) : [];
          const list = commandList().filter((c) => {
            const hay = norm(c.label + ' ' + c.k);
            return words.every((w) => hay.indexOf(w) !== -1);
          });
          html = section('Commands', list.length
            ? list.map((c) => btn(escapeHtml(c.label), { icon: c.icon, hint: c.hint, on: c.on, run: (el) => runCmd(c, el) })).join('')
            : '<div class="ov-empty">No matching commands.</div>');
          html += foot();
        } else if (overlayMode === 'suggest' && suggestCtx) {
          const s = suggestCtx;
          const pool = s.kind === 'tag' ? modeTags(state.mode) : modeProjects(state.mode);
          const hits = pool.filter((t) => !s.q || t.key.indexOf(s.q) !== -1)
            .sort((a, b) => (b.key.indexOf(s.q) === 0) - (a.key.indexOf(s.q) === 0) || b.total - a.total)
            .slice(0, 10);
          const head = (s.neg ? 'Exclude ' : '') + (s.kind === 'tag' ? 'Tags' : 'Featured work') + ' in ' + MODE_LABEL[state.mode];
          html = section(head, hits.length
            ? hits.map((t) => btn(escapeHtml(t.label), {
                icon: s.kind === 'tag' ? '#' : '◇',
                on: s.kind === 'tag' && state.tags.indexOf(t.key) !== -1,
                hint: t.total + ' ' + (t.total === 1 ? MODE_ONE[state.mode] : MODE_LABEL[state.mode].toLowerCase()),
                run: () => applySuggestion(s.kind, t.label)
              })).join('')
            : '<div class="ov-empty">No ' + (s.kind === 'tag' ? 'tags' : 'projects') + ' start with “' + escapeHtml(s.q) + '”.</div>');
        } else if (overlayMode === 'menu') {
          const filtered = !!(parsed.terms.length || state.tags.length);
          const viewHint = (mode) => { const n = countFor(mode); return filtered ? n + ' match' + (n === 1 ? '' : 'es') : String(n); };
          html += section('View',
            btn('Roles', { icon: state.mode === 'roles' ? '●' : '○', on: state.mode === 'roles', hint: viewHint('roles'), run: () => { switchMode('roles'); renderOverlay(); } })
            + btn('Services', { icon: state.mode === 'services' ? '●' : '○', on: state.mode === 'services', hint: viewHint('services'), run: () => { switchMode('services'); renderOverlay(); } }));
          html += section('Sort',
            btn('Relevance', { icon: '↯', on: state.sort === 'relevance', run: () => { setSort('relevance'); renderOverlay(); } })
            + btn('A–Z', { icon: 'A', on: state.sort === 'az', run: () => { setSort('az'); renderOverlay(); } })
            + btn('Original order', { icon: '≣', on: state.sort === 'original', run: () => { setSort('original'); renderOverlay(); } }));
          const counts = new Map();
          results.forEach((m) => m.tagsL.forEach((k) => counts.set(k, (counts.get(k) || 0) + 1)));
          const on = new Set(state.tags);
          const tags = modeTags(state.mode);
          const tagGroups = new Map();
          tags.forEach((t) => {
            const id = window.hireTags ? window.hireTags.categoryOf(t.label) : 'other';
            if (!tagGroups.has(id)) tagGroups.set(id, []);
            tagGroups.get(id).push(t);
          });
          const catOrder = window.hireTags ? window.hireTags.categories.map((c) => c.id) : [];
          const groupedHtml = Array.from(tagGroups.entries())
            .sort((a, b) => (catOrder.indexOf(a[0]) + 1 || 999) - (catOrder.indexOf(b[0]) + 1 || 999))
            .map(([id, list]) => '<div class="ov-sub">' + escapeHtml(window.hireTags ? window.hireTags.label(id) : 'Tags') + '</div>'
              + '<div class="ov-chips">' + list.map((t) => chip(t.label, counts.get(t.key) || 0, on.has(t.key), () => { toggleTag(t.key); renderOverlay(); })).join('') + '</div>')
            .join('');
          html += section('Tags · ' + tags.length, groupedHtml);
          const projects = modeProjects(state.mode);
          if (projects.length) {
            const pc = new Map();
            results.forEach((m) => m.workL.forEach((k) => pc.set(k, (pc.get(k) || 0) + 1)));
            const q = norm(state.query);
            html += section('Featured work',
              projects.map((p) => btn(escapeHtml(p.label), {
                icon: '◇',
                on: workTermRe(p.key).test(q),
                hint: String(pc.get(p.key) || 0),
                run: () => { toggleProject(p.label); renderOverlay(); }
              })).join(''));
          }
          html += section('Search tips',
            btn('<code>#tag</code> filter by tag', { icon: '#', run: () => insertText('#') })
            + btn('<code>work:</code> featured work / project', { icon: '◇', run: () => insertText('work:') })
            + btn('<code>title:</code> titles only', { icon: 'T', run: () => insertText('title:') })
            + btn('<code>cat:</code> tag category (languages, tools…)', { icon: '▦', run: () => insertText('cat:') })
            + btn('<code>is:primary</code> primary roles', { icon: '★', run: () => insertText('is:primary') })
            + btn('<code>"exact phrase"</code>', { icon: '“', run: () => insertText('"') })
            + btn('<code>-word</code> exclude', { icon: '−', run: () => insertText('-') })
            + btn('<code>&gt;</code> run a command', { icon: '›', run: () => { qInput.value = ''; insertText('>'); } }));
          html += foot();
        }
        qOverlay.innerHTML = html;
        if (ovSel >= ovActions.length) ovSel = Math.max(0, ovActions.length - 1);
        paintSel(false);
      }

      function selectable() { return Array.from(qOverlay.querySelectorAll('[data-ov]')); }

      function paintSel(scroll) {
        const items = selectable();
        const always = overlayMode === 'suggest' || overlayMode === 'command-query';
        items.forEach((el, k) => el.classList.toggle('is-sel', (kbNav || always) && k === ovSel));
        if (scroll && items[ovSel]) items[ovSel].scrollIntoView({ block: 'nearest' });
      }

      function runSel() {
        const el = selectable()[ovSel];
        if (!el) return false;
        const fn = ovActions[+el.dataset.ov];
        if (fn) fn(el);
        return true;
      }

      function openOverlay(mode) {
        if (overlayMode !== mode) { ovSel = 0; kbNav = false; }
        overlayMode = mode;
        renderOverlay();
        qOverlay.classList.add('show');
        if (mode === 'menu' || mode === 'commands') qOverlay.scrollTop = 0;
      }

      function closeOverlay() {
        overlayMode = null;
        suggestCtx = null;
        qOverlay.classList.remove('show');
      }

      /* ---------- wiring ---------- */
      // The component's own click handlers toggle .show first; these run
      // after and decide the real state.
      qMenuBtn.addEventListener('click', () => { overlayMode === 'menu' ? closeOverlay() : openOverlay('menu'); });
      qCmdBtn.addEventListener('click', () => { overlayMode === 'commands' ? closeOverlay() : openOverlay('commands'); });

      qOverlay.addEventListener('mousedown', (e) => {
        e.preventDefault(); // keep focus in the input so the bar stays open
        if (document.activeElement !== qInput) qInput.focus();
      });
      qOverlay.addEventListener('click', (e) => {
        const el = e.target.closest('[data-ov]');
        if (!el) return;
        const fn = ovActions[+el.dataset.ov];
        if (fn) fn(el);
      });
      qOverlay.addEventListener('mousemove', (e) => {
        const el = e.target.closest('[data-ov]');
        if (!el || !kbNav) return;
        kbNav = false;
        paintSel(false);
      });

      if (qClear) {
        qClear.addEventListener('mousedown', (e) => e.preventDefault());
        qClear.addEventListener('click', (e) => {
          e.stopPropagation();
          closeOverlay();
          setQuery('');
          qInput.focus();
        });
      }

      qWrap.addEventListener('focusout', (e) => {
        if (!qWrap.contains(e.relatedTarget)) { overlayMode = null; suggestCtx = null; }
      });
      qInput.addEventListener('click', () => {
        // component hides the overlay on click; keep live modes in sync
        if (overlayMode === 'menu' || overlayMode === 'commands') overlayMode = null;
        else if (overlayMode) qOverlay.classList.add('show');
      });

      qInput.addEventListener('input', () => {
        const v = qInput.value;
        const p = parseQuery(v);
        if (p.command != null) {
          state.query = v;
          parsed = p;
          if (qBar) qBar.classList.add('has-query');
          openOverlay('command-query');
          return; // don't filter cards while typing a command
        }
        const sug = suggestionFor();
        if (sug) {
          suggestCtx = sug;
          openOverlay('suggest');
        } else if (overlayMode) {
          closeOverlay();
        }
        state.query = v;
        refresh();
      });

      qInput.addEventListener('keydown', (e) => {
        const open = !!overlayMode && qOverlay.classList.contains('show');
        const n = open ? selectable().length : 0;
        if (open && n) {
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (!kbNav && overlayMode !== 'suggest' && overlayMode !== 'command-query') { kbNav = true; ovSel = e.key === 'ArrowDown' ? 0 : n - 1; }
            else { kbNav = true; ovSel = (ovSel + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; }
            paintSel(true);
            return;
          }
          const live = overlayMode === 'suggest' || overlayMode === 'command-query';
          if ((e.key === 'Enter' && (kbNav || live)) || (e.key === 'Tab' && overlayMode === 'suggest')) {
            e.preventDefault();
            runSel();
            return;
          }
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          if (overlayMode) closeOverlay();
          else if (state.query || state.tags.length) clearAll();
          else qInput.blur();
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          closeOverlay();
          qInput.blur(); // dismisses the keyboard on phones
          focusFirst();
        }
      });

      document.addEventListener('keydown', (e) => {
        const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable);
        if ((e.metaKey || e.ctrlKey) && !e.altKey && (e.key === 'k' || e.key === 'K')) {
          e.preventDefault();
          qInput.focus();
          openOverlay('commands');
          return;
        }
        if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === '/') {
          e.preventDefault();
          qInput.focus();
        } else if (e.key === 'Escape' && (state.query || state.tags.length)) {
          clearAll();
        }
      });

      tagStrip.addEventListener('click', (e) => {
        const el = e.target.closest('.tag-chip');
        if (!el) return;
        if (el.dataset.act === 'clear') clearAll();
        else if (el.dataset.tag) toggleTag(el.dataset.tag);
      });
      tagStrip.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
        if (tagStrip.scrollWidth <= tagStrip.clientWidth) return;
        e.preventDefault();
        tagStrip.scrollLeft += e.deltaY;
      }, { passive: false });

      board.addEventListener('click', (e) => {
        const el = e.target.closest('.card-tag');
        if (el && el.dataset.tag) {
          e.preventDefault();
          toggleTag(el.dataset.tag);
        }
      });

      if (emptyBox) {
        emptyBox.addEventListener('click', (e) => {
          const el = e.target.closest('[data-act]');
